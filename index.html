<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>quasarNet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f5;--bg2:#fff;--text:#1a1a1a;--text2:#6b6b6b;
  --border:#e0e0e0;--accent:#2563eb;--accent2:#1d4ed8;
  --card:#fff;--input:#fff;--hover:#eee;--shadow:rgba(0,0,0,.06);
  --bubble:#dbeafe;--bubble-b:#93c5fd;--overlay:rgba(255,255,255,.75);
  --sidebar:#fff;--chatbg:#f9fafb;--pill:#f1f3f5;--pillb:#dee2e6;
}
[data-theme="dark"]{
  --bg:#1a1a1a;--bg2:#242424;--text:#e8e8e8;--text2:#999;
  --border:#333;--accent:#60a5fa;--accent2:#93c5fd;
  --card:#2a2a2a;--input:#333;--hover:#333;--shadow:rgba(0,0,0,.3);
  --bubble:#2a3a2a;--bubble-b:#3a5a3a;--overlay:rgba(26,26,26,.88);
  --sidebar:#242424;--chatbg:#1e1e1e;--pill:#333;--pillb:#444;
}
html,body{height:100%;background:var(--bg);transition:background .35s,color .35s}
body{color:var(--text);font-family:'Inter',Arial,sans-serif;font-size:13px;overflow:hidden}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.8)}70%{transform:scale(1.03)}to{opacity:1;transform:scale(1)}}
@keyframes bubbleIn{from{opacity:0;transform:translateY(8px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}50%{box-shadow:0 0 0 4px rgba(37,99,235,.1)}}
@keyframes slideRight{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}

.topbar{position:fixed;top:0;left:0;right:0;height:52px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;z-index:100;box-shadow:0 1px 4px var(--shadow);transition:background .35s,border .35s;animation:slideDown .4s ease}
.topbar-logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;color:var(--accent);cursor:pointer;user-select:none;letter-spacing:-0.5px;transition:opacity .2s}
.topbar-logo:hover{opacity:.75}
.topbar-nav{display:flex;align-items:center;gap:4px;margin-left:28px}
.topbar-tab{padding:6px 16px;border:none;background:none;color:var(--text2);font-size:13px;cursor:pointer;border-radius:20px;transition:all .25s;font-family:inherit}
.topbar-tab:hover{background:var(--hover);color:var(--text)}
.topbar-tab.active{background:var(--accent);color:#fff}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.theme-toggle{width:36px;height:36px;border:none;background:var(--hover);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);transition:background .2s}
.theme-toggle:hover{background:var(--border)}
.topbar-btn{padding:7px 18px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;transition:all .25s}
.topbar-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.topbar-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;cursor:pointer;transition:transform .2s;overflow:hidden}
.topbar-avatar img{width:100%;height:100%;object-fit:cover}
.topbar-avatar:hover{transform:scale(1.1)}
.topbar-user-btn{display:none;padding:6px 12px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:20px;cursor:pointer;font-size:12px;font-family:inherit;transition:all .25s;align-items:center;gap:6px}
.topbar-user-btn:hover{border-color:var(--accent);color:var(--accent)}
.topbar-user-btn.visible{display:flex}

.main{margin-top:52px;height:calc(100vh - 52px);transition:background .35s}
.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;background:var(--bg);transition:background .35s}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(3rem,11vw,5rem);letter-spacing:-1px;user-select:none;line-height:1;animation:popIn .6s ease}
.logo span{display:inline-block;transition:color .3s}
.tagline{margin-top:.7rem;color:var(--text2);font-size:14px;animation:slideUp .7s ease .1s both}
.stage-actions{margin-top:2rem;display:flex;gap:14px;animation:slideUp .8s ease .2s both}
.stage-actions.hidden-when-logged{display:none}
.stage-btn{padding:11px 32px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;cursor:pointer;font-size:14px;font-family:inherit;transition:all .3s}
.stage-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 20px var(--shadow)}
.stage-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.stage-btn.primary:hover{background:var(--accent2);transform:translateY(-2px);box-shadow:0 6px 24px rgba(37,99,235,.3)}
.stage-logged{display:none;flex-direction:column;align-items:center;gap:12px;animation:slideUp .8s ease .2s both}
.stage-logged.visible{display:flex}

.chats-layout{display:none;height:100%;animation:fadeIn .35s ease}
.chats-layout.active{display:flex}
.chats-sidebar{width:320px;min-width:320px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:background .35s,border .35s}
.chats-sidebar-header{padding:16px;border-bottom:1px solid var(--border);transition:border .35s}
.search-pill{display:flex;align-items:center;gap:8px;background:var(--pill);border:1px solid var(--pillb);border-radius:24px;padding:8px 16px;transition:all .3s;animation:slideRight .4s ease}
.search-pill:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1);animation:glowPulse 1.5s ease infinite}
.search-pill-icon{color:var(--text2);flex-shrink:0}
.search-pill input{flex:1;border:none;background:none;outline:none;font-size:13px;color:var(--text);font-family:inherit}
.search-pill input::placeholder{color:var(--text2)}
.chat-list{flex:1;overflow-y:auto;padding:8px}
.chat-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:all .25s;animation:slideUp .3s ease both;position:relative}
.chat-item:hover{background:var(--hover);transform:translateX(4px)}
.chat-item.active{background:var(--hover)}
.chat-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:60%;background:var(--accent);border-radius:0 3px 3px 0}
.chat-item-avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0;transition:transform .25s;overflow:hidden}
.chat-item-avatar img{width:100%;height:100%;object-fit:cover}
.chat-item:hover .chat-item-avatar{transform:scale(1.08)}
.chat-item-info{flex:1;min-width:0}
.chat-item-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
.chat-item-last{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-empty{text-align:center;color:var(--text2);padding:40px 16px;font-size:13px;animation:fadeIn .5s ease}
.chats-main{flex:1;display:flex;flex-direction:column;background:var(--chatbg);transition:background .35s}
.chats-main-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--card);transition:background .35s,border .35s;animation:slideDown .3s ease}
.chats-main-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;overflow:hidden}
.chats-main-avatar img{width:100%;height:100%;object-fit:cover}
.chats-main-info{flex:1}
.chats-main-name{font-size:14px;font-weight:600;color:var(--text)}
.chats-main-status{font-size:12px;color:var(--text2)}
.chat-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:16px 20px}
.chat-empty-main{margin:auto;text-align:center;color:var(--text2);font-size:13px;animation:fadeIn .5s ease}
.chat-msg{display:flex;gap:10px;align-items:flex-start;animation:bubbleIn .3s ease}
.chat-msg .bubble-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0;overflow:hidden}
.chat-msg .bubble-avatar img{width:100%;height:100%;object-fit:cover}
.chat-msg .bubble-content{background:var(--card);border:1px solid var(--border);border-radius:12px;border-top-left-radius:4px;padding:8px 12px;max-width:70%;transition:background .35s,border .35s}
.chat-msg.own{flex-direction:row-reverse}
.chat-msg.own .bubble-content{background:var(--bubble);border-color:var(--bubble-b);border-top-left-radius:12px;border-top-right-radius:4px}
.bubble-name{font-size:10px;color:var(--accent);margin-bottom:3px;font-weight:600}
.bubble-text{font-size:13px;line-height:1.4;word-break:break-word}
.bubble-time{font-size:10px;color:var(--text2);margin-top:4px}
.chat-input-row{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:10px;background:var(--card);transition:background .35s,border .35s;animation:slideUp .3s ease}
.chat-input-row input{flex:1;border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-family:inherit;font-size:13px;outline:none;background:var(--input);color:var(--text);transition:all .25s}
.chat-input-row input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.chat-input-row input::placeholder{color:var(--text2)}
.chat-locked{margin:auto;text-align:center;display:flex;flex-direction:column;gap:.8rem;color:var(--text2);font-size:13px;animation:fadeIn .4s ease}

.overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:var(--overlay);opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(3px)}
.overlay.open{opacity:1;pointer-events:auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 32px var(--shadow);animation:popIn .3s ease}
.card-auth{width:min(380px,90vw);padding:1.8rem}
.card-profile{width:min(420px,90vw);padding:1.8rem}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem;padding-bottom:.8rem;border-bottom:1px solid var(--border)}
.card-title{font-size:18px;color:var(--text);font-weight:600}
.card-close{background:none;border:none;cursor:pointer;font-size:20px;color:var(--text2);padding:4px;border-radius:6px;transition:all .2s}
.card-close:hover{background:var(--hover);color:var(--text)}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:1.2rem}
.tab{flex:1;text-align:center;padding:8px 0;background:none;border:none;border-bottom:2px solid transparent;color:var(--text2);cursor:pointer;font-size:13px;font-family:inherit;transition:all .2s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.field{margin-bottom:.9rem;display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;color:var(--text2);font-weight:500}
.field input,.field textarea{border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-family:inherit;font-size:13px;color:var(--text);background:var(--input);outline:none;resize:none;transition:all .25s}
.field input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.btn{display:inline-block;padding:9px 18px;font-family:inherit;font-size:13px;color:var(--text);border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;transition:all .25s}
.btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent2)}
.btn-block{width:100%;padding:10px 0;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.divider{display:flex;align-items:center;gap:.6rem;margin:1rem 0;color:var(--text2);font-size:11px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
.btn-google{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 0;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-family:inherit;font-size:13px;cursor:pointer;transition:all .25s}
.btn-google:hover{box-shadow:0 2px 8px var(--shadow);border-color:var(--accent);transform:translateY(-1px)}
.msg{font-size:12px;min-height:1.2em;margin-top:.7rem;text-align:center}
.msg.error{color:#dc2626}
.msg.success{color:#16a34a}

.profile-header{display:flex;align-items:center;gap:1rem;margin-bottom:1.2rem}
.profile-avatar-wrap{position:relative;cursor:pointer;flex-shrink:0}
.profile-avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:600;font-size:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-avatar-overlay{position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.profile-avatar-wrap:hover .profile-avatar-overlay{opacity:1}
.profile-avatar-overlay .material-symbols-outlined{color:#fff;font-size:20px}
#avatarFileInput{display:none}
.profile-email{font-size:12px;color:var(--text2);word-break:break-all}
.profile-since{font-size:11px;color:var(--text2);margin-top:2px}

.toast-stack{position:fixed;bottom:1.2rem;right:1.2rem;z-index:300;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 16px var(--shadow);padding:10px 16px;font-size:12px;color:var(--text);max-width:280px;display:flex;align-items:flex-start;gap:10px;opacity:0;transform:translateY(12px) scale(.95);transition:all .35s cubic-bezier(.34,1.56,.64,1)}
.toast.show{opacity:1;transform:translateY(0) scale(1)}
.toast .toast-icon{width:20px;height:20px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:1px;animation:popIn .3s ease;display:flex;align-items:center;justify-content:center}
.toast .toast-icon .material-symbols-outlined{font-size:14px;color:#fff}
.toast .toast-text b{display:block;margin-bottom:2px;color:var(--text)}

.hidden{display:none !important}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20;vertical-align:middle;line-height:1}
.material-symbols-outlined.filled{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 20}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text2)}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo" id="topbarLogo">quasarNet</div>
  <div class="topbar-nav" id="topbarNav">
    <button class="topbar-tab active" data-view="home"><span class="material-symbols-outlined" style="font-size:18px;margin-right:4px">home</span>Главная</button>
    <button class="topbar-tab" data-view="chats"><span class="material-symbols-outlined" style="font-size:18px;margin-right:4px">chat</span>Чаты</button>
  </div>
  <div class="topbar-right">
    <button class="theme-toggle" id="themeToggle" title="Сменить тему"><span class="material-symbols-outlined">dark_mode</span></button>
    <button class="topbar-btn" id="authTrigger"><span class="material-symbols-outlined" style="font-size:16px;margin-right:4px">person</span>Войти</button>
    <button class="topbar-user-btn" id="userTrigger">
      <div class="topbar-avatar" id="topbarAvatar"></div>
      <span id="topbarUserName"></span>
    </button>
  </div>
</div>

<div class="main">
  <div class="stage" id="viewHome">
    <div class="logo">
      <span style="color:#2563eb">q</span><span style="color:#6b7280">u</span><span style="color:#9ca3af">a</span><span style="color:#d1d5db">s</span><span style="color:#9ca3af">a</span><span style="color:#6b7280">r</span><span style="color:var(--text)">Net</span>
    </div>
    <div class="tagline">общение без лишнего</div>
    <div class="stage-actions" id="stageActions">
      <button class="stage-btn primary" id="stageLoginBtn"><span class="material-symbols-outlined" style="font-size:18px;margin-right:6px">login</span>Войти</button>
      <button class="stage-btn" id="stageRegBtn"><span class="material-symbols-outlined" style="font-size:18px;margin-right:6px">person_add</span>Регистрация</button>
    </div>
    <div class="stage-logged" id="stageLogged">
      <div class="profile-avatar" id="stageAvatar" style="width:80px;height:80px;font-size:28px">?</div>
      <div style="font-size:16px;font-weight:600" id="stageName"></div>
      <div style="color:var(--text2);font-size:13px" id="stageEmail"></div>
    </div>
  </div>

  <div class="chats-layout" id="viewChats">
    <div class="chats-sidebar">
      <div class="chats-sidebar-header">
        <div class="search-pill">
          <span class="search-pill-icon"><span class="material-symbols-outlined">search</span></span>
          <input type="text" id="chatSearchInput" placeholder="найти человека..." maxlength="40">
        </div>
      </div>
      <div class="chat-list" id="chatList"></div>
    </div>
    <div class="chats-main">
      <div class="chats-main-header hidden" id="chatMainHeader">
        <div class="chats-main-avatar" id="chatMainAvatar"></div>
        <div class="chats-main-info">
          <div class="chats-main-name" id="chatMainName"></div>
          <div class="chats-main-status" id="chatMainStatus"></div>
        </div>
      </div>
      <div class="chat-body" id="chatBody">
        <div class="chat-empty-main"><span class="material-symbols-outlined" style="font-size:48px;color:var(--border);display:block;margin-bottom:12px">forum</span>Найдите человека и начните общение</div>
      </div>
      <div class="chat-locked hidden" id="chatLocked">
        <span class="material-symbols-outlined" style="font-size:48px;color:var(--text2)">lock</span>
        <div>Войдите, чтобы писать сообщения</div>
        <button class="btn btn-primary" id="chatLoginBtn"><span class="material-symbols-outlined" style="font-size:16px;margin-right:4px">login</span>Войти</button>
      </div>
      <div class="chat-input-row hidden" id="chatInputRow">
        <input type="text" id="chatInput" placeholder="Напиши сообщение..." maxlength="500">
        <button class="btn btn-primary" id="chatSend"><span class="material-symbols-outlined" style="font-size:16px;margin-right:4px">send</span></button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="authOverlay">
  <div class="card card-auth">
    <div class="card-header">
      <div class="card-title" id="authTitle">Вход</div>
      <button class="card-close" id="authClose"><span class="material-symbols-outlined">close</span></button>
    </div>
    <div id="authForms">
      <div class="tabs">
        <button class="tab active" data-mode="login">Вход</button>
        <button class="tab" data-mode="register">Регистрация</button>
      </div>
      <div class="field">
        <label for="authEmail">Email</label>
        <input type="email" id="authEmail" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="authPassword">Пароль</label>
        <input type="password" id="authPassword" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" autocomplete="current-password">
      </div>
      <button class="btn btn-primary btn-block" id="authSubmit"><span class="material-symbols-outlined" style="font-size:16px;margin-right:4px">login</span>Войти</button>
      <div class="divider">или</div>
      <button class="btn-google" id="authGoogle"><span class="material-symbols-outlined" style="font-size:18px">person</span>Войти с Google</button>
      <div class="msg" id="authMessage"></div>
    </div>
  </div>
</div>

<div class="overlay" id="profileOverlay">
  <div class="card card-profile">
    <div class="card-header">
      <div class="card-title">Профиль</div>
      <button class="card-close" id="profileClose"><span class="material-symbols-outlined">close</span></button>
    </div>
    <div class="profile-header">
      <div class="profile-avatar-wrap" id="avatarWrap" title="Нажмите, чтобы изменить аватар">
        <div class="profile-avatar" id="profileAvatar">?</div>
        <div class="profile-avatar-overlay"><span class="material-symbols-outlined">photo_camera</span></div>
        <input type="file" id="avatarFileInput" accept="image/*">
      </div>
      <div>
        <div class="profile-email" id="profileEmail"></div>
        <div class="profile-since" id="profileSince"></div>
      </div>
    </div>
    <div class="field">
      <label for="profileName">Имя профиля</label>
      <input type="text" id="profileName" placeholder="Как к тебе обращаться?" maxlength="40">
    </div>
    <div class="field">
      <label for="profileBio">О себе</label>
      <textarea id="profileBio" rows="3" maxlength="200" placeholder="Пара слов о себе"></textarea>
    </div>
    <button class="btn btn-primary btn-block" id="profileSave"><span class="material-symbols-outlined" style="font-size:16px;margin-right:4px">save</span>Сохранить</button>
    <div class="msg" id="profileMessage"></div>
    <button class="btn btn-block" id="authLogout" style="margin-top:.6rem"><span class="material-symbols-outlined" style="font-size:16px;margin-right:4px">logout</span>Выйти</button>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script>
function initApp(){
const{signInWithEmailAndPassword,createUserWithEmailAndPassword,signInWithPopup,signOut,onAuthStateChanged,updateProfile,doc,getDoc,setDoc,updateDoc,serverTimestamp,collection,addDoc,query,orderBy,limit,onSnapshot,getDocs,where}=window.firebaseFns;

const html=document.documentElement;
const themeBtn=document.getElementById('themeToggle');
html.setAttribute('data-theme',localStorage.getItem('qn-theme')||'light');
updateThemeIcon();
themeBtn.addEventListener('click',()=>{const c=html.getAttribute('data-theme'),n=c==='dark'?'light':'dark';html.setAttribute('data-theme',n);localStorage.setItem('qn-theme',n);updateThemeIcon()});
function updateThemeIcon(){themeBtn.innerHTML=html.getAttribute('data-theme')==='dark'?'<span class="material-symbols-outlined filled">light_mode</span>':'<span class="material-symbols-outlined filled">dark_mode</span>'}

const homeView=document.getElementById('viewHome'),chatsView=document.getElementById('viewChats'),tabs=document.querySelectorAll('.topbar-tab');
function switchView(n){homeView.style.display=n==='home'?'flex':'none';chatsView.classList.toggle('active',n==='chats');tabs.forEach(t=>t.classList.toggle('active',t.dataset.view===n))}
tabs.forEach(t=>t.addEventListener('click',()=>switchView(t.dataset.view)));
document.getElementById('topbarLogo').addEventListener('click',()=>switchView('home'));

const toastStack=document.getElementById('toastStack');
function showToast(title,body,opts){opts=opts||{};const t=document.createElement('div');t.className='toast';t.innerHTML='<div class="toast-icon"><span class="material-symbols-outlined filled">info</span></div><div class="toast-text"><b></b><span></span></div>';t.querySelector('b').textContent=title;t.querySelector('span').textContent=body||'';toastStack.appendChild(t);requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add('show')));setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),400)},opts.duration||3500)}

function initials(t){return t?t.trim().slice(0,2).toUpperCase():'?'}

function friendlyError(c){const m={'auth/invalid-email':'Некорректный email','auth/user-not-found':'Пользователь не найден','auth/wrong-password':'Неверный пароль','auth/email-already-in-use':'Email уже зарегистрирован','auth/weak-password':'Пароль слишком короткий','auth/invalid-credential':'Неверный email или пароль','auth/popup-closed-by-user':'Окно входа закрыто'};return m[c]||'Что-то пошло не так'}
function formatDate(ts){if(!ts)return'';const d=ts.toDate?ts.toDate():new Date(ts);return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}
function formatTime(ts){if(!ts)return'...';const d=ts.toDate?ts.toDate():new Date(ts);return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}

let mode='login',currentUser=null,usersCache={},currentAvatarData=null;

const authOverlay=document.getElementById('authOverlay'),authClose=document.getElementById('authClose'),authForms=document.getElementById('authForms'),authTitle=document.getElementById('authTitle'),emailInput=document.getElementById('authEmail'),passwordInput=document.getElementById('authPassword'),submitBtn=document.getElementById('authSubmit'),googleBtn=document.getElementById('authGoogle'),messageEl=document.getElementById('authMessage'),authTrigger=document.getElementById('authTrigger'),userTrigger=document.getElementById('userTrigger'),topbarAvatar=document.getElementById('topbarAvatar'),topbarUserName=document.getElementById('topbarUserName'),stageActions=document.getElementById('stageActions'),stageLogged=document.getElementById('stageLogged'),stageAvatar=document.getElementById('stageAvatar'),stageName=document.getElementById('stageName'),stageEmail=document.getElementById('stageEmail');

function openAuth(){authOverlay.classList.add('open')}
function closeAuth(){authOverlay.classList.remove('open');setMessage('')}
function setMessage(t,c){messageEl.textContent=t||'';messageEl.className='msg'+(c?' '+c:'')}
function setMode(m){mode=m;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.mode===m));submitBtn.innerHTML=m==='login'?'<span class="material-symbols-outlined" style="font-size:16px;margin-right:4px">login</span>Войти':'<span class="material-symbols-outlined" style="font-size:16px;margin-right:4px">person_add</span>Создать аккаунт';authTitle.textContent=m==='login'?'Вход':'Регистрация';setMessage('')}

authTrigger.addEventListener('click',openAuth);
authClose.addEventListener('click',closeAuth);
authOverlay.addEventListener('click',e=>{if(e.target===authOverlay)closeAuth()});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>setMode(t.dataset.mode)));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeAuth();closeProfile()}});

submitBtn.addEventListener('click',async()=>{const email=emailInput.value.trim(),password=passwordInput.value;if(!email||!password){setMessage('Заполни email и пароль','error');return}submitBtn.disabled=true;setMessage('');try{if(mode==='login')await signInWithEmailAndPassword(auth,email,password);else await createUserWithEmailAndPassword(auth,email,password)}catch(e){setMessage(friendlyError(e.code),'error')}finally{submitBtn.disabled=false}});
googleBtn.addEventListener('click',async()=>{try{await signInWithPopup(auth,window.googleProvider)}catch(e){setMessage(friendlyError(e.code),'error')}});

const profileOverlay=document.getElementById('profileOverlay'),profileClose=document.getElementById('profileClose'),profileAvatarEl=document.getElementById('profileAvatar'),profileEmailEl=document.getElementById('profileEmail'),profileSinceEl=document.getElementById('profileSince'),profileNameEl=document.getElementById('profileName'),profileBioEl=document.getElementById('profileBio'),profileSaveBtn=document.getElementById('profileSave'),profileMessageEl=document.getElementById('profileMessage'),authLogoutBtn=document.getElementById('authLogout'),avatarFileInput=document.getElementById('avatarFileInput'),avatarWrap=document.getElementById('avatarWrap');

function openProfile(){profileOverlay.classList.add('open')}
function closeProfile(){profileOverlay.classList.remove('open');setProfileMessage('')}
function setProfileMessage(t,c){profileMessageEl.textContent=t||'';profileMessageEl.className='msg'+(c?' '+c:'')}

userTrigger.addEventListener('click',openProfile);
profileClose.addEventListener('click',closeProfile);
profileOverlay.addEventListener('click',e=>{if(e.target===profileOverlay)closeProfile()});

avatarWrap.addEventListener('click',()=>avatarFileInput.click());
avatarFileInput.addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(file.size>200000){showToast('Ошибка','Файл слишком большой (макс 200КБ)');return}const reader=new FileReader();reader.onload=()=>{currentAvatarData=reader.result;profileAvatarEl.innerHTML='<img src="'+currentAvatarData+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover">'};reader.readAsDataURL(file)});

profileSaveBtn.addEventListener('click',async()=>{const user=auth.currentUser;if(!user)return;profileSaveBtn.disabled=true;setProfileMessage('');try{const d={displayName:profileNameEl.value.trim(),bio:profileBioEl.value.trim(),nick:profileNameEl.value.trim().toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'')||user.email?.split('@')[0]||''};if(currentAvatarData)d.avatar=currentAvatarData;await updateDoc(doc(db,'users',user.uid),d);if((user.displayName||'')!==profileNameEl.value.trim())await updateProfile(user,{displayName:profileNameEl.value.trim()||null});const av=currentAvatarData||usersCache[user.uid]?.avatar||'';updateIdentityUI(profileNameEl.value.trim(),user.email,av);currentAvatarData=null;avatarFileInput.value='';await loadAllUsers();setProfileMessage('Сохранено','success');showToast('Профиль','Изменения сохранены')}catch(e){setProfileMessage(friendlyError(e.code),'error')}finally{profileSaveBtn.disabled=false}});

authLogoutBtn.addEventListener('click',async()=>{await signOut(auth);closeProfile()});

function updateIdentityUI(name,email,avatar){const short=initials(name||email);authTrigger.classList.add('hidden');userTrigger.classList.add('visible');topbarAvatar.innerHTML=avatar?'<img src="'+avatar+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover">':short;topbarUserName.textContent=name||'Аккаунт';profileAvatarEl.innerHTML=avatar?'<img src="'+avatar+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover">':short;profileEmailEl.textContent=email||'';stageAvatar.innerHTML=avatar?'<img src="'+avatar+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover">':short;stageName.textContent=name||'';stageEmail.textContent=email||''}

async function loadAllUsers(){try{const s=await getDocs(collection(db,'users'));usersCache={};s.forEach(d=>{const data=d.data();const nick=data.nick||data.email?.split('@')[0]||d.id.slice(0,8);usersCache[d.id]={name:data.displayName||data.email||'',avatar:data.avatar||'',nick:nick};if(data.nick!==nick)updateDoc(doc(db,'users',d.id),{nick:nick}).catch(()=>{})})}catch(e){}}

function makeChatId(uid1,uid2){return[uid1,uid2].sort().join('_')}
const GLOBAL_CHAT_ID='global';

const chatListEl=document.getElementById('chatList'),chatBodyEl=document.getElementById('chatBody'),chatLockedEl=document.getElementById('chatLocked'),chatInputRowEl=document.getElementById('chatInputRow'),chatInputEl=document.getElementById('chatInput'),chatSendBtn=document.getElementById('chatSend'),chatLoginBtn=document.getElementById('chatLoginBtn'),chatSearchInput=document.getElementById('chatSearchInput'),chatMainHeaderEl=document.getElementById('chatMainHeader'),chatMainAvatarEl=document.getElementById('chatMainAvatar'),chatMainNameEl=document.getElementById('chatMainName'),chatMainStatusEl=document.getElementById('chatMainStatus');

let activeChatId=null,activeChatUser=null,unsubscribeChat=null,isFirstChatSnapshot=true;

chatLoginBtn.addEventListener('click',()=>{closeAuth();openAuth();setMode('login')});

function renderGlobalChatItem(){
  const item=document.createElement('div');
  item.className='chat-item'+(activeChatId===GLOBAL_CHAT_ID?' active':'');
  item.style.animationDelay='0s';
  item.innerHTML='<div class="chat-item-avatar" style="background:linear-gradient(135deg,#16a34a,#22c55e)"><span class="material-symbols-outlined" style="color:#fff;font-size:20px">public</span></div><div class="chat-item-info"><div class="chat-item-name">Общий чат</div><div class="chat-item-last">Все участники сайта</div></div>';
  item.addEventListener('click',()=>openGlobalChat());
  chatListEl.appendChild(item);
}

function openGlobalChat(){
  if(!currentUser){chatLockedEl.classList.remove('hidden');chatInputRowEl.classList.add('hidden');return}
  activeChatId=GLOBAL_CHAT_ID;activeChatUser={uid:'global',name:'Общий чат',avatar:'',nick:'general'};
  chatMainHeaderEl.classList.remove('hidden');
  chatMainAvatarEl.innerHTML='<span class="material-symbols-outlined" style="color:#fff;font-size:20px">public</span>';
  chatMainAvatarEl.style.background='linear-gradient(135deg,#16a34a,#22c55e)';
  chatMainNameEl.textContent='Общий чат';
  chatMainStatusEl.textContent='Все участники';
  document.querySelectorAll('.chat-item').forEach(el=>el.classList.remove('active'));
  const items=chatListEl.querySelectorAll('.chat-item');
  if(items[0])items[0].classList.add('active');
  chatLockedEl.classList.add('hidden');chatInputRowEl.classList.remove('hidden');
  subscribeChat();
}

function openGlobalChatWithDoc(){
  const ref=doc(db,'chats',GLOBAL_CHAT_ID);
  getDoc(ref).then(snap=>{
    if(!snap.exists()){setDoc(ref,{type:'global',name:'Общий чат',lastMessage:'',lastMessageAt:serverTimestamp()}).catch(()=>{})}
  }).catch(()=>{});
}

async function renderChatList(q){
  if(!currentUser){chatListEl.innerHTML='<div class="chat-empty"><span class="material-symbols-outlined" style="font-size:32px;color:var(--border);display:block;margin-bottom:8px">forum</span>Войдите, чтобы видеть чаты</div>';return}
  chatListEl.innerHTML='';
  renderGlobalChatItem();
  if(q){
    const s=q.toLowerCase();const results=[];
    for(const [uid,d] of Object.entries(usersCache)){if(uid===currentUser.uid)continue;if(d.name.toLowerCase().includes(s)||d.nick.toLowerCase().includes(s))results.push({uid,...d})}
    if(results.length===0){chatListEl.innerHTML+='<div class="chat-empty" style="padding:16px"><span class="material-symbols-outlined" style="font-size:24px;color:var(--border);display:block;margin-bottom:4px">person_search</span>Никого не нашли</div>';return}
    results.forEach((p,i)=>{const item=document.createElement('div');item.className='chat-item';item.style.animationDelay=((i+1)*.05)+'s';item.innerHTML='<div class="chat-item-avatar">'+(p.avatar?'<img src="'+p.avatar+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover">':initials(p.name))+'</div><div class="chat-item-info"><div class="chat-item-name">'+p.name+'</div><div class="chat-item-last">@'+p.nick+'</div></div>';item.addEventListener('click',()=>startChatWith(uid));chatListEl.appendChild(item)});
    return;
  }
  loadActiveChats();
}

async function loadActiveChats(){
  try{const s=await getDocs(collection(db,'chats'));const myChats=[];
  s.forEach(d=>{const data=d.data();if(d.id===GLOBAL_CHAT_ID)return;if(data.participants&&data.participants.includes(currentUser.uid))myChats.push({id:d.id,...data})});
  myChats.sort((a,b)=>(b.lastMessageAt?.seconds||0)-(a.lastMessageAt?.seconds||0));
  myChats.forEach((chat,i)=>{const otherUid=chat.participants.find(p=>p!==currentUser.uid);const other=usersCache[otherUid]||{name:'Пользователь',avatar:'',nick:''};const item=document.createElement('div');item.className='chat-item'+(activeChatId===chat.id?' active':'');item.style.animationDelay=((i+1)*.05)+'s';item.innerHTML='<div class="chat-item-avatar">'+(other.avatar?'<img src="'+other.avatar+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover">':initials(other.name))+'</div><div class="chat-item-info"><div class="chat-item-name">'+other.name+'</div><div class="chat-item-last">'+(chat.lastMessage||'@'+other.nick)+'</div></div>';item.addEventListener('click',()=>openChatWith(otherUid));chatListEl.appendChild(item)})
  }catch(e){}
}

async function startChatWith(uid){
  if(!currentUser)return;
  const chatId=makeChatId(currentUser.uid,uid);
  const ref=doc(db,'chats',chatId);const snap=await getDoc(ref);
  if(!snap.exists()){await setDoc(ref,{participants:[currentUser.uid,uid],lastMessage:'',lastMessageAt:serverTimestamp(),lastMessageName:''})}
  openChatWith(uid);
}

function openChatWith(uid){
  const other=usersCache[uid];if(!other)return;
  activeChatId=makeChatId(currentUser.uid,uid);activeChatUser={uid,...other};
  chatMainHeaderEl.classList.remove('hidden');
  chatMainAvatarEl.innerHTML=other.avatar?'<img src="'+other.avatar+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover">':initials(other.name);
  chatMainAvatarEl.style.background='';
  chatMainNameEl.textContent=other.name+' (@'+other.nick+')';
  chatMainStatusEl.textContent='Личный чат';
  document.querySelectorAll('.chat-item').forEach(el=>el.classList.remove('active'));
  if(!currentUser){chatLockedEl.classList.remove('hidden');chatInputRowEl.classList.add('hidden')}else{chatLockedEl.classList.add('hidden');chatInputRowEl.classList.remove('hidden')}
  subscribeChat();
}

chatSearchInput.addEventListener('input',e=>renderChatList(e.target.value));

function subscribeChat(){
  if(unsubscribeChat)unsubscribeChat();isFirstChatSnapshot=true;
  const q=query(collection(db,'chats',activeChatId,'messages'),orderBy('createdAt','asc'),limit(100));
  unsubscribeChat=onSnapshot(q,snap=>{renderMessages(snap.docs);if(!isFirstChatSnapshot){snap.docChanges().forEach(ch=>{if(ch.type==='added'){const m=ch.doc.data();if(!currentUser||m.uid!==currentUser.uid)showToast('Сообщение',m.name+': '+m.text)}})}isFirstChatSnapshot=false},()=>{});
}

function renderMessages(docs){
  if(docs.length===0){chatBodyEl.innerHTML='<div class="chat-empty-main">Начните переписку</div>';return}
  chatBodyEl.innerHTML='';docs.forEach(d=>{const m=d.data();const isOwn=currentUser&&m.uid===currentUser.uid;const uA=usersCache[m.uid]?.avatar||'';const row=document.createElement('div');row.className='chat-msg'+(isOwn?' own':'');row.innerHTML='<div class="bubble-avatar">'+(uA?'<img src="'+uA+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover">':initials(m.name))+'</div><div class="bubble-content"><div class="bubble-name">'+(m.name||'Без имени')+'</div><div class="bubble-text">'+(m.text||'')+'</div><div class="bubble-time">'+formatTime(m.createdAt)+'</div></div>';chatBodyEl.appendChild(row)});
  chatBodyEl.scrollTop=chatBodyEl.scrollHeight;
}

async function sendMessage(){
  const text=chatInputEl.value.trim();if(!text||!currentUser||!activeChatId)return;
  chatSendBtn.disabled=true;
  const name=profileNameEl.value.trim()||currentUser.displayName||currentUser.email||'Без имени';
  const avatar=usersCache[currentUser.uid]?.avatar||'';
  try{
    await addDoc(collection(db,'chats',activeChatId,'messages'),{uid:currentUser.uid,name,avatar,text:text.slice(0,500),createdAt:serverTimestamp()});
    if(activeChatId!==GLOBAL_CHAT_ID){
      await updateDoc(doc(db,'chats',activeChatId),{lastMessage:text.slice(0,100),lastMessageAt:serverTimestamp(),lastMessageName:name});
    }
    chatInputEl.value='';
  }catch(e){showToast('Ошибка',friendlyError(e.code))}
  finally{chatSendBtn.disabled=false}
}
chatSendBtn.addEventListener('click',sendMessage);
chatInputEl.addEventListener('keydown',e=>{if(e.key==='En17:51 02.08.2026ter')sendMessage()});

onAuthStateChanged(auth,async user=>{
  currentUser=user;
  if(user){
    authForms.classList.add('hidden');authTitle.textContent='Профиль';
    try{const ref=doc(db,'users',user.uid),snap=await getDoc(ref);let data;
    if(!snap.exists()){await setDoc(ref,{email:user.email,displayName:user.displayName||'',bio:'',avatar:'',nick:user.email?.split('@')[0]||'',createdAt:serverTimestamp()});data={email:user.email,displayName:user.displayName||'',bio:'',avatar:'',nick:user.email?.split('@')[0]||'',createdAt:null}}else data=snap.data();
    profileNameEl.value=data.displayName||user.displayName||'';profileBioEl.value=data.bio||'';profileSinceEl.textContent=data.createdAt?'На сайте с '+formatDate(data.createdAt):'';profileEmailEl.textContent=user.email||'';
    updateIdentityUI(data.displayName||user.displayName,user.email,data.avatar||'');
    await loadAllUsers();renderChatList('');
    openGlobalChatWithDoc();
    stageActions.classList.add('hidden-when-logged');stageLogged.classList.add('visible');
  }catch(e){}
    chatLockedEl.classList.add('hidden');chatInputRowEl.classList.remove('hidden');
  }else{
    authTrigger.classList.remove('hidden');userTrigger.classList.remove('visible');topbarAvatar.innerHTML='';topbarUserName.textContent='';
    authForms.classList.remove('hidden');profileOverlay.classList.remove('open');authTitle.textContent=mode==='login'?'Вход':'Регистрация';
    emailInput.value='';passwordInput.value='';currentAvatarData=null;avatarFileInput.value='';
    chatLockedEl.classList.remove('hidden');chatInputRowEl.classList.add('hidden');usersCache={};activeChatId=null;activeChatUser=null;
    stageActions.classList.remove('hidden-when-logged');stageLogged.classList.remove('visible');
  }
  if(currentUser&&activeChatId)subscribeChat();
  renderChatList(chatSearchInput.value);
});

renderChatList('');
}
</script>

<script type="module">

window.firebaseFns={signInWithEmailAndPassword,createUserWithEmailAndPassword,signInWithPopup,signOut,onAuthStateChanged,updateProfile,doc,getDoc,setDoc,updateDoc,serverTimestamp,collection,addDoc,query,orderBy,limit,onSnapshot,getDocs,where};
