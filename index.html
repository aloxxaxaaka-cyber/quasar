<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>quasarNet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }

  :root {
    --bg: #f5f5f5;
    --bg-secondary: #ffffff;
    --text: #1a1a1a;
    --text-secondary: #6b6b6b;
    --border: #e0e0e0;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --card-bg: #ffffff;
    --input-bg: #ffffff;
    --hover: #eeeeee;
    --shadow: rgba(0,0,0,0.06);
    --bubble-own: #dbeafe;
    --bubble-own-border: #93c5fd;
    --overlay-bg: rgba(255,255,255,0.75);
    --sidebar-bg: #ffffff;
    --chat-bg: #f9fafb;
    --pill-bg: #f1f3f5;
    --pill-border: #dee2e6;
  }

  [data-theme="dark"] {
    --bg: #1a1a1a;
    --bg-secondary: #242424;
    --text: #e8e8e8;
    --text-secondary: #999999;
    --border: #333333;
    --accent: #60a5fa;
    --accent-hover: #93c5fd;
    --card-bg: #2a2a2a;
    --input-bg: #333333;
    --hover: #333333;
    --shadow: rgba(0,0,0,0.3);
    --bubble-own: #2a3a2a;
    --bubble-own-border: #3a5a3a;
    --overlay-bg: rgba(26,26,26,0.88);
    --sidebar-bg: #242424;
    --chat-bg: #1e1e1e;
    --pill-bg: #333333;
    --pill-border: #444444;
  }

  html, body{
    height:100%;
    background:var(--bg);
    transition: background 0.35s ease, color 0.35s ease;
  }

  body{
    color:var(--text);
    font-family:'Inter', Arial, Helvetica, sans-serif;
    font-size:13px;
    overflow: hidden;
  }

  a{ color:var(--accent); text-decoration:none; }
  a:hover{ text-decoration:underline; }

  /* ---------- keyframes ---------- */
  @keyframes fadeIn{
    from{ opacity:0; }
    to{ opacity:1; }
  }
  @keyframes slideUp{
    from{ opacity:0; transform:translateY(16px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes slideDown{
    from{ opacity:0; transform:translateY(-16px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes slideLeft{
    from{ opacity:0; transform:translateX(20px); }
    to{ opacity:1; transform:translateX(0); }
  }
  @keyframes slideRight{
    from{ opacity:0; transform:translateX(-20px); }
    to{ opacity:1; transform:translateX(0); }
  }
  @keyframes scaleIn{
    from{ opacity:0; transform:scale(0.92); }
    to{ opacity:1; transform:scale(1); }
  }
  @keyframes popIn{
    from{ opacity:0; transform:scale(0.8); }
    70%{ transform:scale(1.03); }
    to{ opacity:1; transform:scale(1); }
  }
  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:0.5; }
  }
  @keyframes shimmer{
    0%{ background-position:-200% 0; }
    100%{ background-position:200% 0; }
  }
  @keyframes bubbleIn{
    from{ opacity:0; transform:translateY(8px) scale(0.95); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes glowPulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(37,99,235,0); }
    50%{ box-shadow:0 0 0 4px rgba(37,99,235,0.1); }
  }

  /* ---------- topbar ---------- */
  .topbar{
    position:fixed; top:0; left:0; right:0; height:52px;
    background:var(--card-bg); border-bottom:1px solid var(--border);
    display:flex; align-items:center; padding:0 20px; z-index:100;
    box-shadow:0 1px 4px var(--shadow);
    transition: background 0.35s, border 0.35s, box-shadow 0.35s;
    animation: slideDown 0.4s ease;
  }

  .topbar-logo{
    font-weight:700; font-size:18px; color:var(--accent);
    cursor:pointer; user-select:none; letter-spacing:-0.5px;
    transition: color 0.2s, opacity 0.2s;
  }
  .topbar-logo:hover{ opacity:0.75; }

  .topbar-nav{
    display:flex; align-items:center; gap:4px; margin-left:28px;
  }

  .topbar-tab{
    padding:6px 16px; border:none; background:none;
    color:var(--text-secondary); font-size:13px; cursor:pointer;
    border-radius:20px; transition:all 0.25s ease; font-family:inherit;
    position:relative; overflow:hidden;
  }
  .topbar-tab::after{
    content:''; position:absolute; bottom:0; left:50%; width:0; height:2px;
    background:var(--accent); transition:all 0.25s; transform:translateX(-50%);
  }
  .topbar-tab:hover{ background:var(--hover); color:var(--text); }
  .topbar-tab.active{ background:var(--accent); color:#fff; }
  .topbar-tab.active::after{ width:0; }

  .topbar-right{
    margin-left:auto; display:flex; align-items:center; gap:10px;
  }

  .theme-toggle{
    width:36px; height:36px; border:none; background:var(--hover);
    border-radius:50%; cursor:pointer; display:flex; align-items:center;
    justify-content:center; font-size:16px; color:var(--text);
    transition: background 0.2s, color 0.2s;
  }
  .theme-toggle:hover{ background:var(--border); }

  .topbar-btn{
    padding:7px 18px; border:1px solid var(--border);
    background:var(--card-bg); color:var(--text); border-radius:6px;
    cursor:pointer; font-size:13px; font-family:inherit;
    transition:all 0.25s ease;
  }
  .topbar-btn:hover{ border-color:var(--accent); color:var(--accent); transform:translateY(-1px); }
  .topbar-btn.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .topbar-btn.primary:hover{ background:var(--accent-hover); transform:translateY(-1px); }

  .topbar-avatar{
    width:32px; height:32px; border-radius:50%; background:var(--accent);
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:600; cursor:pointer; transition:transform 0.2s;
  }
  .topbar-avatar:hover{ transform:scale(1.1); }

  /* ---------- main ---------- */
  .main{
    margin-top:52px; height:calc(100vh - 52px);
    transition:background 0.35s;
  }

  /* ---------- stage ---------- */
  .stage{
    height:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:2rem;
    background:var(--bg); transition:background 0.35s;
  }

  .logo{
    font-weight:700; font-size:clamp(3rem,11vw,5rem);
    letter-spacing:-1px; user-select:none; line-height:1;
    animation:popIn 0.6s ease;
  }
  .logo span{ display:inline-block; transition:color 0.3s; }

  .tagline{
    margin-top:0.7rem; color:var(--text-secondary); font-size:14px;
    animation:slideUp 0.7s ease 0.1s both;
  }

  .stage-actions{
    margin-top:2rem; display:flex; gap:14px;
    animation:slideUp 0.8s ease 0.2s both;
  }

  .stage-btn{
    padding:11px 32px; border:1px solid var(--border);
    background:var(--card-bg); color:var(--text); border-radius:8px;
    cursor:pointer; font-size:14px; font-family:inherit;
    transition:all 0.3s ease; position:relative; overflow:hidden;
  }
  .stage-btn::before{
    content:''; position:absolute; top:50%; left:50%; width:0; height:0;
    background:var(--accent); opacity:0.06; border-radius:50%;
    transition:width 0.5s, height 0.5s; transform:translate(-50%,-50%);
  }
  .stage-btn:hover::before{ width:300px; height:300px; }
  .stage-btn:hover{ border-color:var(--accent); color:var(--accent); transform:translateY(-2px); box-shadow:0 6px 20px var(--shadow); }
  .stage-btn.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .stage-btn.primary:hover{ background:var(--accent-hover); transform:translateY(-2px); box-shadow:0 6px 24px rgba(37,99,235,0.3); }

  /* ---------- chats layout ---------- */
  .chats-layout{
    display:none; height:100%; animation:fadeIn 0.35s ease;
  }
  .chats-layout.active{ display:flex; }

  .chats-sidebar{
    width:320px; min-width:320px; background:var(--sidebar-bg);
    border-right:1px solid var(--border); display:flex; flex-direction:column;
    transition:background 0.35s, border 0.35s;
  }

  .chats-sidebar-header{
    padding:16px; border-bottom:1px solid var(--border);
    transition:border 0.35s;
  }

  .search-pill{
    display:flex; align-items:center; gap:8px;
    background:var(--pill-bg); border:1px solid var(--pill-border);
    border-radius:24px; padding:8px 16px;
    transition:all 0.3s ease; animation:slideRight 0.4s ease;
  }
  .search-pill:focus-within{
    border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,0.1);
    animation:glowPulse 1.5s ease infinite;
  }
  .search-pill-icon{ color:var(--text-secondary); font-size:14px; flex-shrink:0; }
  .search-pill input{
    flex:1; border:none; background:none; outline:none;
    font-size:13px; color:var(--text); font-family:inherit;
  }
  .search-pill input::placeholder{ color:var(--text-secondary); }

  .chat-list{
    flex:1; overflow-y:auto; padding:8px;
  }

  .chat-item{
    display:flex; align-items:center; gap:12px;
    padding:10px 12px; border-radius:10px; cursor:pointer;
    transition:all 0.25s ease; animation:slideUp 0.3s ease both;
    position:relative;
  }
  .chat-item:hover{ background:var(--hover); transform:translateX(4px); }
  .chat-item.active{ background:var(--hover); }
  .chat-item.active::before{
    content:''; position:absolute; left:0; top:50%; transform:translateY(-50%);
    width:3px; height:60%; background:var(--accent); border-radius:0 3px 3px 0;
  }

  .chat-item-avatar{
    width:42px; height:42px; border-radius:50%;
    background:linear-gradient(135deg, var(--accent), var(--accent-hover));
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:600; flex-shrink:0;
    transition:transform 0.25s; overflow:hidden;
  }
  .chat-item-avatar img{ width:100%; height:100%; object-fit:cover; }
  .chat-item:hover .chat-item-avatar{ transform:scale(1.08); }

  .chat-item-info{ flex:1; min-width:0; }
  .chat-item-name{ font-size:13px; font-weight:600; color:var(--text); margin-bottom:2px; }
  .chat-item-last{ font-size:12px; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-item-time{ font-size:11px; color:var(--text-secondary); flex-shrink:0; margin-top:2px; }

  .chat-item-badge{
    width:18px; height:18px; border-radius:50%; background:var(--accent);
    color:#fff; font-size:10px; font-weight:600; display:flex;
    align-items:center; justify-content:center; flex-shrink:0;
    animation:popIn 0.3s ease;
  }

  .chat-empty{
    text-align:center; color:var(--text-secondary); padding:40px 16px;
    font-size:13px; animation:fadeIn 0.5s ease;
  }

  .chats-main{
    flex:1; display:flex; flex-direction:column;
    background:var(--chat-bg); transition:background 0.35s;
  }

  .chats-main-header{
    padding:14px 20px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:12px;
    background:var(--card-bg); transition:background 0.35s, border 0.35s;
    animation:slideDown 0.3s ease;
  }

  .chats-main-avatar{
    width:36px; height:36px; border-radius:50%;
    background:linear-gradient(135deg, var(--accent), var(--accent-hover));
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:600; flex-shrink:0; overflow:hidden;
  }
  .chats-main-avatar img{ width:100%; height:100%; object-fit:cover; }

  .chats-main-info{ flex:1; }
  .chats-main-name{ font-size:14px; font-weight:600; color:var(--text); }
  .chats-main-status{ font-size:12px; color:var(--text-secondary); }

  .chat-body{
    flex:1; overflow-y:auto; display:flex; flex-direction:column;
    gap:10px; padding:16px 20px;
  }

  .chat-empty-main{
    margin:auto; text-align:center; color:var(--text-secondary);
    font-size:13px; animation:fadeIn 0.5s ease;
  }

  .chat-msg{
    display:flex; gap:10px; align-items:flex-start;
    animation:bubbleIn 0.3s ease;
  }
  .chat-msg .bubble-avatar{
    width:28px; height:28px; border-radius:50%;
    background:linear-gradient(135deg, var(--accent), var(--accent-hover));
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:600; flex-shrink:0; overflow:hidden;
  }
  .chat-msg .bubble-avatar img{ width:100%; height:100%; object-fit:cover; }
  .chat-msg .bubble-content{
    background:var(--card-bg); border:1px solid var(--border);
    border-radius:12px; border-top-left-radius:4px;
    padding:8px 12px; max-width:70%;
    transition:background 0.35s, border 0.35s;
  }
  .chat-msg.own{ flex-direction:row-reverse; }
  .chat-msg.own .bubble-content{
    background:var(--bubble-own); border-color:var(--bubble-own-border);
    border-top-left-radius:12px; border-top-right-radius:4px;
  }
  .bubble-name{ font-size:10px; color:var(--accent); margin-bottom:3px; font-weight:600; }
  .bubble-text{ font-size:13px; line-height:1.4; word-break:break-word; }
  .bubble-time{ font-size:10px; color:var(--text-secondary); margin-top:4px; }

  .chat-input-row{
    padding:12px 20px; border-top:1px solid var(--border);
    display:flex; gap:10px; background:var(--card-bg);
    transition:background 0.35s, border 0.35s;
    animation:slideUp 0.3s ease;
  }
  .chat-input-row input{
    flex:1; border:1px solid var(--border); border-radius:8px;
    padding:10px 14px; font-family:inherit; font-size:13px;
    outline:none; background:var(--input-bg); color:var(--text);
    transition:all 0.25s;
  }
  .chat-input-row input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,0.08); }
  .chat-input-row input::placeholder{ color:var(--text-secondary); }

  .chat-locked{
    margin:auto; text-align:center; display:flex;
    flex-direction:column; gap:0.8rem; color:var(--text-secondary);
    font-size:13px; animation:fadeIn 0.4s ease;
  }

  /* ---------- overlay ---------- */
  .overlay{
    position:fixed; inset:0; z-index:200;
    display:flex; align-items:center; justify-content:center;
    background:var(--overlay-bg); opacity:0; pointer-events:none;
    transition:opacity 0.3s ease; backdrop-filter:blur(3px);
  }
  .overlay.open{ opacity:1; pointer-events:auto; }

  .card{
    background:var(--card-bg); border:1px solid var(--border);
    border-radius:12px; box-shadow:0 8px 32px var(--shadow);
    animation:popIn 0.3s ease;
  }

  .card-auth{ width:min(380px, 90vw); padding:1.8rem; }

  .card-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:1.2rem; padding-bottom:0.8rem;
    border-bottom:1px solid var(--border);
  }
  .card-title{ font-size:18px; color:var(--text); font-weight:600; }
  .card-close{
    background:none; border:none; cursor:pointer; font-size:20px;
    color:var(--text-secondary); padding:4px; border-radius:6px;
    transition:all 0.2s;
  }
  .card-close:hover{ background:var(--hover); color:var(--text); }

  .tabs{
    display:flex; border-bottom:1px solid var(--border); margin-bottom:1.2rem;
  }
  .tab{
    flex:1; text-align:center; padding:8px 0; background:none;
    border:none; border-bottom:2px solid transparent;
    color:var(--text-secondary); cursor:pointer; font-size:13px;
    font-family:inherit; transition:all 0.2s;
  }
  .tab.active{ color:var(--accent); border-bottom-color:var(--accent); }

  .field{ margin-bottom:0.9rem; display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:11px; color:var(--text-secondary); font-weight:500; }
  .field input, .field textarea{
    border:1px solid var(--border); border-radius:8px;
    padding:9px 12px; font-family:inherit; font-size:13px;
    color:var(--text); background:var(--input-bg); outline:none;
    resize:none; transition:all 0.25s;
  }
  .field input:focus, .field textarea:focus{
    border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,0.08);
  }

  .btn{
    display:inline-block; padding:9px 18px; font-family:inherit;
    font-size:13px; color:var(--text); border:1px solid var(--border);
    border-radius:8px; background:var(--card-bg); cursor:pointer;
    transition:all 0.25s;
  }
  .btn:hover{ border-color:var(--accent); color:var(--accent); transform:translateY(-1px); }
  .btn-primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn-primary:hover{ background:var(--accent-hover); }
  .btn-block{ width:100%; padding:10px 0; font-size:13px; }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; transform:none; }

  .divider{
    display:flex; align-items:center; gap:0.6rem;
    margin:1rem 0; color:var(--text-secondary); font-size:11px;
  }
  .divider::before, .divider::after{ content:""; flex:1; height:1px; background:var(--border); }

  .btn-google{
    width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
    padding:9px 0; border:1px solid var(--border); border-radius:8px;
    background:var(--card-bg); color:var(--text); font-family:inherit;
    font-size:13px; cursor:pointer; transition:all 0.25s;
  }
  .btn-google:hover{ box-shadow:0 2px 8px var(--shadow); border-color:var(--accent); transform:translateY(-1px); }

  .msg{ font-size:12px; min-height:1.2em; margin-top:0.7rem; text-align:center; }
  .msg.error{ color:#dc2626; }
  .msg.success{ color:#16a34a; }

  .profile-header{ display:flex; align-items:center; gap:0.8rem; margin-bottom:1rem; }
  .profile-avatar-wrap{ position:relative; cursor:pointer; flex-shrink:0; }
  .profile-avatar{
    width:56px; height:56px; border-radius:50%;
    background:linear-gradient(135deg, var(--accent), var(--accent-hover));
    color:#fff; font-weight:600; font-size:18px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    overflow:hidden; transition:opacity 0.2s;
  }
  .profile-avatar img{ width:100%; height:100%; object-fit:cover; }
  .profile-avatar-overlay{
    position:absolute; inset:0; border-radius:50%;
    background:rgba(0,0,0,0.5); display:flex; align-items:center;
    justify-content:center; opacity:0; transition:opacity 0.2s;
  }
  .profile-avatar-wrap:hover .profile-avatar-overlay{ opacity:1; }
  .profile-avatar-overlay .material-symbols-outlined{ color:#fff; font-size:20px; }
  #avatarFileInput{ display:none; }
  .profile-email{ font-size:12px; color:var(--text-secondary); word-break:break-all; }
  .profile-since{ font-size:11px; color:var(--text-secondary); margin-top:2px; }

  .toast-stack{
    position:fixed; bottom:1.2rem; right:1.2rem; z-index:300;
    display:flex; flex-direction:column; gap:8px; align-items:flex-end;
  }
  .toast{
    background:var(--card-bg); border:1px solid var(--border);
    border-radius:10px; box-shadow:0 4px 16px var(--shadow);
    padding:10px 16px; font-size:12px; color:var(--text);
    max-width:280px; display:flex; align-items:flex-start; gap:10px;
    opacity:0; transform:translateY(12px) scale(0.95);
    transition:all 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }
  .toast.show{ opacity:1; transform:translateY(0) scale(1); }
  .toast .toast-icon{
    width:20px; height:20px; border-radius:50%; background:var(--accent);
    flex-shrink:0; margin-top:1px; animation:popIn 0.3s ease;
    display:flex; align-items:center; justify-content:center;
  }
  .toast .toast-icon .material-symbols-outlined{ font-size:14px; color:#fff; }
  .toast .toast-text b{ display:block; margin-bottom:2px; color:var(--text); }

  .hidden{ display:none !important; }

  .material-symbols-outlined{
    font-variation-settings:'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
    vertical-align:middle; line-height:1;
  }
  .material-symbols-outlined.filled{
    font-variation-settings:'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 20;
  }

  ::-webkit-scrollbar{ width:5px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:3px; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--text-secondary); }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-logo" id="topbarLogo">quasarNet</div>
  <div class="topbar-nav" id="topbarNav">
    <button class="topbar-tab active" data-view="home"><span class="material-symbols-outlined" style="font-size:18px; margin-right:4px;">home</span>Главная</button>
    <button class="topbar-tab" data-view="chats"><span class="material-symbols-outlined" style="font-size:18px; margin-right:4px;">chat</span>Чаты</button>
  </div>
  <div class="topbar-right">
    <button class="theme-toggle" id="themeToggle" title="Сменить тему"><span class="material-symbols-outlined">dark_mode</span></button>

      <button class="btn btn-block" id="authLogout" style="margin-top:0.6rem;"><span class="material-symbols-outlined" style="font-size:16px; margin-right:4px;">logout</span>Выйти</button>
    </div>

<!-- SCRIPTS -->
<script>
function initApp(){
  const {
    signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup,
    signOut, onAuthStateChanged, updateProfile,
    doc, getDoc, setDoc, updateDoc, serverTimestamp,
    collection, addDoc, query, orderBy, limit, onSnapshot, getDocs
  } = window.firebaseFns;

  const html = document.documentElement;
  const themeBtn = document.getElementById('themeToggle');
  const savedTheme = localStorage.getItem('qn-theme') || 'light';
  html.setAttribute('data-theme', savedTheme);
  updateThemeIcon();

  themeBtn.addEventListener('click', () => {
    const cur = html.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('qn-theme', next);
    updateThemeIcon();
  });

  function updateThemeIcon(){
    const isDark = html.getAttribute('data-theme') === 'dark';
    themeBtn.innerHTML = isDark
      ? '<span class="material-symbols-outlined filled">light_mode</span>'
      : '<span class="material-symbols-outlined filled">dark_mode</span>';
  }

  // ---------- navigation ----------
  const homeView = document.getElementById('viewHome');
  const chatsView = document.getElementById('viewChats');
  const tabs = document.querySelectorAll('.topbar-tab');

  function switchView(name){
    homeView.style.display = name === 'home' ? 'flex' : 'none';
    chatsView.classList.toggle('active', name === 'chats');
    tabs.forEach(t => t.classList.toggle('active', t.dataset.view === name));
  }

  tabs.forEach(t => t.addEventListener('click', () => switchView(t.dataset.view)));
  document.getElementById('topbarLogo').addEventListener('click', () => switchView('home'));
  document.getElementById('stageLoginBtn').addEventListener('click', () => { openAuth(); setMode('login'); });
  document.getElementById('stageRegBtn').addEventListener('click', () => { openAuth(); setMode('register'); });

  // ---------- toast ----------
  const toastStack = document.getElementById('toastStack');
  function showToast(title, body, opts){
    opts = opts || {};
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = '<div class="toast-icon"><span class="material-symbols-outlined filled">info</span></div><div class="toast-text"><b></b><span></span></div>';
    t.querySelector('b').textContent = title;
    t.querySelector('span').textContent = body || '';
    toastStack.appendChild(t);
    requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('show')));
    setTimeout(() => {
      t.classList.remove('show');
      setTimeout(() => t.remove(), 400);
    }, opts.duration || 3500);
  }

  // ---------- auth ----------
  const authOverlay = document.getElementById('authOverlay');
  const authClose = document.getElementById('authClose');
  const authForms = document.getElementById('authForms');
  const profilePanel = document.getElementById('profilePanel');
  const authTitle = document.getElementById('authTitle');
  const tabsAuth = document.querySelectorAll('.tab');
  const emailInput = document.getElementById('authEmail');
  const passwordInput = document.getElementById('authPassword');
  const submitBtn = document.getElementById('authSubmit');
  const googleBtn = document.getElementById('authGoogle');
  const messageEl = document.getElementById('authMessage');
  const authTrigger = document.getElementById('authTrigger');
  const topbarAvatar = document.getElementById('topbarAvatar');
  const profileAvatar = document.getElementById('profileAvatar');
  const profileEmail = document.getElementById('profileEmail');
  const profileSince = document.getElementById('profileSince');
  const profileName = document.getElementById('profileName');
  const profileBio = document.getElementById('profileBio');
  const profileSave = document.getElementById('profileSave');
  const profileMessage = document.getElementById('profileMessage');
  const authLogout = document.getElementById('authLogout');

  let mode = 'login';
  let currentUser = null;
  let usersCache = {};
  let currentAvatarData = null;

  function openAuth(){ authOverlay.classList.add('open'); }
  function closeAuth(){ authOverlay.classList.remove('open'); setMessage(''); setProfileMessage(''); }
  function setMessage(t,c){ messageEl.textContent=t||''; messageEl.className='msg'+(c?' '+c:''); }
  function setProfileMessage(t,c){ profileMessage.textContent=t||''; profileMessage.className='msg'+(c?' '+c:''); }

  function setMode(m){
    mode=m;
    tabsAuth.forEach(t=>t.classList.toggle('active',t.dataset.mode===m));
    submitBtn.innerHTML=m==='login'
      ? '<span class="material-symbols-outlined" style="font-size:16px; margin-right:4px;">login</span>Войти'
      : '<span class="material-symbols-outlined" style="font-size:16px; margin-right:4px;">person_add</span>Создать аккаунт';
    authTitle.textContent=m==='login'?'Вход':'Регистрация';
    setMessage('');
  }

  authTrigger.addEventListener('click', openAuth);
  authClose.addEventListener('click', closeAuth);
  authOverlay.addEventListener('click', e=>{ if(e.target===authOverlay) closeAuth(); });
  tabsAuth.forEach(t=>t.addEventListener('click',()=>setMode(t.dataset.mode)));
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeAuth(); } });

  function initials(t){ return t?t.trim().slice(0,2).toUpperCase():'?'; }

  function friendlyError(c){
    const m={
      'auth/invalid-email':'Некорректный email',
      'auth/user-not-found':'Пользователь не найден',
      'auth/wrong-password':'Неверный пароль',
      'auth/email-already-in-use':'Email уже зарегистрирован',
      'auth/weak-password':'Пароль слишком короткий',
      'auth/invalid-credential':'Неверный email или пароль',
      'auth/popup-closed-by-user':'Окно входа закрыто'
    };
    return m[c]||'Что-то пошло не так';
  }

  function formatDate(ts){
    if(!ts) return '';
    const d=ts.toDate?ts.toDate():new Date(ts);
    return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
  }
  function formatTime(ts){
    if(!ts) return '...';
    const d=ts.toDate?ts.toDate():new Date(ts);
    return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  }

  submitBtn.addEventListener('click', async ()=>{
    const email=emailInput.value.trim(), password=passwordInput.value;
    if(!email||!password){ setMessage('Заполни email и пароль','error'); return; }
    submitBtn.disabled=true; setMessage('');
    try{
      if(mode==='login') await signInWithEmailAndPassword(auth,email,password);
      else await createUserWithEmailAndPassword(auth,email,password);
    }catch(e){ setMessage(friendlyError(e.code),'error'); }
    finally{ submitBtn.disabled=false; }
  });

  googleBtn.addEventListener('click', async ()=>{
    try{ await signInWithPopup(auth,googleProvider); }
    catch(e){ setMessage(friendlyError(e.code),'error'); }
  });

  authLogout.addEventListener('click', async ()=>{ await signOut(auth); });

  const avatarFileInput = document.getElementById('avatarFileInput');
  const avatarWrap = document.getElementById('avatarWrap');

  avatarWrap.addEventListener('click', ()=> avatarFileInput.click());
  avatarFileInput.addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    if(file.size > 200000){
      showToast('Ошибка','Файл слишком большой (макс 200КБ)');
      return;
    }
    const reader = new FileReader();
    reader.onload = ()=>{
      currentAvatarData = reader.result;
      profileAvatar.innerHTML = '<img src="'+currentAvatarData+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">';
    };
    reader.readAsDataURL(file);
  });

  async function loadAllUsers(){
    try{
      const snap = await getDocs(collection(db,'users'));
      usersCache = {};
      snap.forEach(d=>{
        const data = d.data();
        usersCache[d.id] = {
          name: data.displayName || data.email || '',
          avatar: data.avatar || '',
          nick: data.nick || data.email?.split('@')[0] || ''
        };
      });
    }catch(e){}
  }

  profileSave.addEventListener('click', async ()=>{
    const user=auth.currentUser; if(!user) return;
    profileSave.disabled=true; setProfileMessage('');
    try{
      const updateData = {
        displayName:profileName.value.trim(),
        bio:profileBio.value.trim(),
        nick: profileName.value.trim().toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'') || user.email?.split('@')[0] || ''
      };
      if(currentAvatarData) updateData.avatar = currentAvatarData;
      await updateDoc(doc(db,'users',user.uid), updateData);
      if((user.displayName||'')!==profileName.value.trim())
        await updateProfile(user,{displayName:profileName.value.trim()||null});
      const avatar = currentAvatarData || usersCache[user.uid]?.avatar || '';
      updateIdentityUI(profileName.value.trim(),user.email, avatar);
      currentAvatarData = null;
      avatarFileInput.value = '';
      await loadUsers();
      renderChatList(chatSearchInput.value);
      setProfileMessage('Сохранено','success');
      showToast('Профиль','Изменения сохранены');
    }catch(e){ setProfileMessage(friendlyError(e.code),'error'); }
    finally{ profileSave.disabled=false; }
  });

  function updateIdentityUI(name,email,avatar){
    const short=initials(name||email);
    authTrigger.classList.add('hidden');
    topbarAvatar.classList.remove('hidden');
    if(avatar){
      topbarAvatar.innerHTML='<img src="'+avatar+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">';
    }else{
      topbarAvatar.textContent=short;
    }
    if(avatar){
      profileAvatar.innerHTML='<img src="'+avatar+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">';
    }else{
      profileAvatar.textContent=short;
    }
    authTrigger.innerHTML='<span class="material-symbols-outlined" style="font-size:16px; margin-right:4px;">person</span>'+(name||'Аккаунт');
  }

  // ---------- chats ----------
  const chatList = document.getElementById('chatList');
  const chatBody = document.getElementById('chatBody');
  const chatLocked = document.getElementById('chatLocked');
  const chatInputRow = document.getElementById('chatInputRow');
  const chatInput = document.getElementById('chatInput');
  const chatSend = document.getElementById('chatSend');
  const chatLoginBtn = document.getElementById('chatLoginBtn');
  const chatSearchInput = document.getElementById('chatSearchInput');
  const chatMainHeader = document.getElementById('chatMainHeader');
  const chatMainAvatar = document.getElementById('chatMainAvatar');
  const chatMainName = document.getElementById('chatMainName');
  const chatMainStatus = document.getElementById('chatMainStatus');

  let activeChatUser = null;
  let unsubscribeChat = null;
  let isFirstChatSnapshot = true;
  let allUsers = [];

  async function loadUsers(){
    await loadAllUsers();
    const users = [];
    for(const [uid, data] of Object.entries(usersCache)){
      if(currentUser && uid === currentUser.uid) continue;
      users.push({
        uid,
        name: data.name || 'Без имени',
        nick: data.nick || uid.slice(0,8),
        avatar: data.avatar || ''
      });
    }
    allUsers = users;
    renderChatList(chatSearchInput.value);
  }

  function renderChatList(q){
    let filtered = allUsers;
    if(q){
      const s=q.toLowerCase();
      filtered=allUsers.filter(p=>p.name.toLowerCase().includes(s)||p.nick.toLowerCase().includes(s));
    }
    if(!currentUser){
      chatList.innerHTML='<div class="chat-empty"><span class="material-symbols-outlined" style="font-size:32px; color:var(--border); display:block; margin-bottom:8px;">forum</span>Войдите, чтобы видеть чаты</div>';
      return;
    }
    if(filtered.length===0){
      chatList.innerHTML='<div class="chat-empty"><span class="material-symbols-outlined" style="font-size:32px; color:var(--border); display:block; margin-bottom:8px;">person_search</span>Пока никого нет</div>';
      return;
    }
    chatList.innerHTML='';
    filtered.forEach((p,i)=>{
      const item=document.createElement('div');
      item.className='chat-item'+(activeChatUser&&activeChatUser.uid===p.uid?' active':'');
      item.style.animationDelay=(i*0.05)+'s';
      const avatarHTML = p.avatar
        ? '<img src="'+p.avatar+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">'
        : initials(p.name);
      item.innerHTML=
        '<div class="chat-item-avatar">'+avatarHTML+'</div>'+
        '<div class="chat-item-info">'+
          '<div class="chat-item-name">'+p.name+'</div>'+
          '<div class="chat-item-last">@'+p.nick+'</div>'+
        '</div>';
      item.addEventListener('click',()=>openChatWith(p));
      chatList.appendChild(item);
    });
  }

  function openChatWith(user){
    activeChatUser=user;
    chatMainHeader.classList.remove('hidden');
    chatMainAvatar.innerHTML = user.avatar
      ? '<img src="'+user.avatar+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">'
      : initials(user.name);
    chatMainName.textContent=user.name+' (@'+user.nick+')';
    chatMainStatus.textContent='Чат';

    document.querySelectorAll('.chat-item').forEach(el=>el.classList.remove('active'));
    const items=chatList.querySelectorAll('.chat-item');
    items.forEach(el=>{
      if(el.querySelector('.chat-item-name').textContent===user.name)
        el.classList.add('active');
    });

    if(!currentUser){
      chatLocked.classList.remove('hidden');
      chatInputRow.classList.add('hidden');
    }else{
      chatLocked.classList.add('hidden');
      chatInputRow.classList.remove('hidden');
    }

    chatBody.innerHTML='<div class="chat-empty-main">Начните переписку с '+user.name+'</div>';

    if(currentUser) subscribeChat();
  }

  chatSearchInput.addEventListener('input',e=>renderChatList(e.target.value));
  chatLoginBtn.addEventListener('click',()=>{ openAuth(); setMode('login'); });

  function subscribeChat(){
    if(unsubscribeChat) unsubscribeChat();
    isFirstChatSnapshot=true;
    const q=query(collection(db,'messages'),orderBy('createdAt','asc'),limit(100));
    unsubscribeChat=onSnapshot(q,snap=>{
      renderMessages(snap.docs);
      if(!isFirstChatSnapshot){
        snap.docChanges().forEach(ch=>{
          if(ch.type==='added'){
            const m=ch.doc.data();
            if(!currentUser||m.uid!==currentUser.uid)
              showToast('Сообщение',(m.name||'Кто-то')+': '+(m.text||''));
          }
        });
      }
      isFirstChatSnapshot=false;
    },()=>{});
  }

  function renderMessages(docs){
    if(docs.length===0){
      chatBody.innerHTML='<div class="chat-empty-main">Пока нет сообщений</div>';
      return;
    }
    chatBody.innerHTML='';
    docs.forEach(d=>{
      const m=d.data();
      const isOwn=currentUser&&m.uid===currentUser.uid;
      const userAvatar = usersCache[m.uid]?.avatar || '';
      const row=document.createElement('div');
      row.className='chat-msg'+(isOwn?' own':'');
      const avatarContent = userAvatar
        ? '<img src="'+userAvatar+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">'
        : initials(m.name);
      row.innerHTML=
        '<div class="bubble-avatar">'+avatarContent+'</div>'+
        '<div class="bubble-content">'+
          '<div class="bubble-name">'+(m.name||'Без имени')+'</div>'+
          '<div class="bubble-text">'+(m.text||'')+'</div>'+
          '<div class="bubble-time">'+formatTime(m.createdAt)+'</div>'+
        '</div>';
      chatBody.appendChild(row);
    });
    chatBody.scrollTop=chatBody.scrollHeight;
  }

  async function sendMessage(){
    const text=chatInput.value.trim();
    if(!text||!currentUser) return;
    chatSend.disabled=true;
    const userAvatar = usersCache[currentUser.uid]?.avatar || '';
    try{
      await addDoc(collection(db,'messages'),{
        uid:currentUser.uid,
        name:profileName.value.trim()||currentUser.displayName||currentUser.email||'Без имени',
        avatar: userAvatar,
        text:text.slice(0,500),
        createdAt:serverTimestamp()
      });
      chatInput.value='';
    }catch(e){ showToast('Ошибка',friendlyError(e.code)); }
    finally{ chatSend.disabled=false; }
  }
  chatSend.addEventListener('click',sendMessage);
  chatInput.addEventListener('keydown',e=>{ if(e.key==='Enter') sendMessage(); });

  // ---------- auth state ----------
  onAuthStateChanged(auth, async user=>{
    currentUser=user;
    if(user){
      authForms.classList.add('hidden');
      profilePanel.classList.remove('hidden');
      authTitle.textContent='Профиль';
      try{
        const ref=doc(db,'users',user.uid);
        const snap=await getDoc(ref);
        let data;
        if(!snap.exists()){
          await setDoc(ref,{email:user.email,displayName:user.displayName||'',bio:'',avatar:'',nick:user.email?.split('@')[0]||'',createdAt:serverTimestamp()});
          data={email:user.email,displayName:user.displayName||'',bio:'',avatar:'',nick:user.email?.split('@')[0]||'',createdAt:null};
        }else data=snap.data();
        profileEmail.textContent=user.email||'';
        profileSince.textContent=data.createdAt?'На сайте с '+formatDate(data.createdAt):'';
        profileName.value=data.displayName||user.displayName||'';
        profileBio.value=data.bio||'';
        const avatar = data.avatar || '';
        updateIdentityUI(data.displayName||user.displayName,user.email,avatar);
        await loadUsers();
      }catch(e){}
      chatLocked.classList.add('hidden');
      chatInputRow.classList.remove('hidden');
    }else{
      authTrigger.classList.remove('hidden');
      authTrigger.innerHTML='<span class="material-symbols-outlined" style="font-size:16px; margin-right:4px;">person</span>Войти';
      topbarAvatar.classList.add('hidden');
      topbarAvatar.innerHTML='';
      authForms.classList.remove('hidden');
      profilePanel.classList.add('hidden');
      authTitle.textContent=mode==='login'?'Вход':'Регистрация';
      emailInput.value=''; passwordInput.value='';
      currentAvatarData=null;
      avatarFileInput.value='';
      chatLocked.classList.remove('hidden');
      chatInputRow.classList.add('hidden');
      usersCache={};
    }
    if(currentUser&&activeChatUser) subscribeChat();
    renderChatList(chatSearchInput.value);
  });

  renderChatList('');
}
</script>
