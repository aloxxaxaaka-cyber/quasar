<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https: blob: data: wss:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src https:;">
<title>quasarNet</title>
<link rel="icon" type="image/png" sizes="16x16" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f5f5;--text:#1a1a1a;--text2:#6b6b6b;--border:#e0e0e0;--accent:#2563eb;--accent2:#1d4ed8;--card:#fff;--input:#fff;--hover:#eee;--shadow:rgba(0,0,0,.06);--bubble:#dbeafe;--bubble2:#f0f4ff;--overlay:rgba(255,255,255,.75);--sidebar:#fff;--chatbg:#f9fafb;--pill:#f1f3f5;--pillb:#dee2e6}
[data-theme="dark"]{--bg:#1a1a1a;--text:#e8e8e8;--text2:#999;--border:#333;--accent:#60a5fa;--accent2:#93c5fd;--card:#2a2a2a;--input:#333;--hover:#333;--shadow:rgba(0,0,0,.3);--bubble:#1e3a1e;--bubble2:#1a2e1a;--overlay:rgba(26,26,26,.88);--sidebar:#242424;--chatbg:#1e1e1e;--pill:#333;--pillb:#444}
html,body{height:100%;background:var(--bg);transition:background .35s,color .35s}
body{color:var(--text);font-family:'Inter',Arial,sans-serif;font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.85)}70%{transform:scale(1.02)}to{opacity:1;transform:scale(1)}}
@keyframes bubbleIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes tabPop{0%{transform:scale(1)}50%{transform:scale(.92)}100%{transform:scale(1)}}
.topbar{position:fixed;top:0;left:0;right:0;height:52px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;z-index:100;box-shadow:0 1px 4px var(--shadow);transition:background .35s,border .35s}
.topbar-logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;color:var(--accent);cursor:pointer;user-select:none;transition:opacity .2s}
.topbar-logo:hover{opacity:.75}
.topbar-nav{display:flex;gap:4px;margin-left:20px}
.topbar-tab{padding:6px 14px;border:none;background:none;color:var(--text2);font-size:13px;cursor:pointer;border-radius:20px;transition:all .25s;font-family:inherit;display:flex;align-items:center;gap:4px}
.topbar-tab:hover{background:var(--hover);color:var(--text)}
.topbar-tab.active{background:var(--accent);color:#fff}
.topbar-tab.bounce{animation:tabPop .3s ease}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.balance-pill{display:none;align-items:center;gap:6px;background:var(--pill);border:1px solid var(--pillb);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--text)}
.balance-pill.visible{display:flex}
.balance-pill .material-symbols-outlined{font-size:16px;color:#f59e0b}
.theme-toggle{width:36px;height:36px;border:none;background:var(--hover);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);transition:background .2s}
.theme-toggle:hover{background:var(--border)}
.topbar-btn{padding:7px 16px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:20px;cursor:pointer;font-size:13px;font-family:inherit;transition:all .25s;display:flex;align-items:center;gap:4px}
.topbar-btn:hover{border-color:var(--accent);color:var(--accent)}
.topbar-user-btn{display:none;padding:4px 10px 4px 4px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:20px;cursor:pointer;font-size:13px;font-family:inherit;transition:all .25s;align-items:center;gap:6px}
.topbar-user-btn:hover{border-color:var(--accent);color:var(--accent)}
.topbar-user-btn.visible{display:flex}
.topbar-avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;overflow:hidden;flex-shrink:0}
.topbar-avatar img{width:100%;height:100%;object-fit:cover}
.main{margin-top:52px;height:calc(100vh - 52px)}
.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(2.5rem,10vw,5rem);letter-spacing:-1px;user-select:none;line-height:1;animation:popIn .6s ease}
.logo span{display:inline-block}
.stage-actions{margin-top:2rem;display:flex;gap:12px;animation:slideUp .8s ease .2s both}
.stage-actions.hidden-when-logged{display:none}
.stage-btn{padding:10px 28px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;cursor:pointer;font-size:14px;font-family:inherit;transition:all .3s;display:flex;align-items:center;gap:6px}
.stage-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 20px var(--shadow)}
.stage-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.stage-btn.primary:hover{background:var(--accent2)}
.stage-logged{display:none;flex-direction:column;align-items:center;gap:12px;animation:slideUp .8s ease .2s both}
.stage-logged.visible{display:flex}
.chats-layout{display:none;height:100%;animation:fadeIn .35s ease}
.chats-layout.active{display:flex}
.chats-sidebar{width:320px;min-width:320px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:background .35s,border .35s}
.chats-sidebar-header{padding:12px;border-bottom:1px solid var(--border)}
.search-pill{display:flex;align-items:center;gap:8px;background:var(--pill);border:1px solid var(--pillb);border-radius:24px;padding:8px 14px;transition:all .3s}
.search-pill:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.search-pill input{flex:1;border:none;background:none;outline:none;font-size:13px;color:var(--text);font-family:inherit}
.search-pill input::placeholder{color:var(--text2)}
.chat-list{flex:1;overflow-y:auto;padding:6px}
.chat-item-avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0;overflow:hidden}
.chat-item-avatar img{width:100%;height:100%;object-fit:cover}
.chat-item-info{flex:1;min-width:0}
.chat-item-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:1px}
.chat-item-last{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-empty{text-align:center;color:var(--text2);padding:40px 16px;font-size:13px;animation:fadeIn .5s ease}
.chat-item-wrap{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;cursor:pointer;transition:all .2s;position:relative}
.chat-item-wrap:hover{background:var(--hover)}
.chat-item-wrap.active{background:var(--hover)}
.chat-item-wrap.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:55%;background:var(--accent);border-radius:0 4px 4px 0}
.chat-unread-badge{position:absolute;right:10px;top:50%;transform:translateY(-50%);min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 5px;flex-shrink:0}
.admin-badge{display:inline-flex;align-items:center;gap:3px;background:#dc2626;color:#fff;font-size:10px;font-weight:600;padding:1px 6px;border-radius:8px;flex-shrink:0;vertical-align:middle}
.admin-badge .material-symbols-outlined{font-size:12px}
.bubble-admin{display:inline-flex;align-items:center;gap:3px;background:#dc2626;color:#fff;font-size:10px;font-weight:600;padding:1px 6px;border-radius:8px;margin-bottom:3px}
.msg-delete{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;border:none;background:#dc2626;color:#fff;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:5;transition:transform .15s}
.msg-delete .material-symbols-outlined{font-size:14px}
.chat-msg:hover .msg-delete{display:flex}
.msg-delete:hover{transform:scale(1.15)}
.ban-btn{background:#dc2626;color:#fff;border:none;border-radius:10px;padding:9px 18px;cursor:pointer;font-size:13px;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:all .25s}
.ban-btn:hover{background:#b91c1c}
.unban-btn{background:#16a34a;color:#fff;border:none;border-radius:10px;padding:9px 18px;cursor:pointer;font-size:13px;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:all .25s}
.unban-btn:hover{background:#15803d}
.chats-main{flex:1;display:flex;flex-direction:column;background:var(--chatbg);transition:background .35s;position:relative}
.chats-main-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--card);transition:background .35s,border .35s}
.chats-main-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;overflow:hidden}
.chats-main-avatar img{width:100%;height:100%;object-fit:cover}
.chats-main-info{flex:1}
.chats-main-name{font-size:14px;font-weight:600;color:var(--text)}
.chats-main-status{font-size:12px;color:var(--text2)}
.chat-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding:12px 16px}
.chat-empty-main{margin:auto;text-align:center;color:var(--text2);font-size:13px;animation:fadeIn .5s ease}
.chat-msg{display:flex;gap:8px;align-items:flex-end;animation:bubbleIn .25s ease;max-width:85%}
.chat-msg.own{margin-left:auto;flex-direction:row-reverse}
.chat-msg .bubble-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;flex-shrink:0;overflow:hidden}
.chat-msg .bubble-avatar img{width:100%;height:100%;object-fit:cover}
.chat-msg .bubble{padding:8px 12px;border-radius:18px;border-bottom-left-radius:6px;word-break:break-word;position:relative}
.chat-msg:not(.own) .bubble{background:var(--card);border:1px solid var(--border);color:var(--text);max-width:calc(100% - 34px)}
.chat-msg.own .bubble{background:var(--accent);color:#fff;border-radius:18px;border-bottom-right-radius:6px;border:none;flex:1;min-width:0}
.bubble-text{font-size:14px;line-height:1.4}
.bubble-nick{font-size:11px;font-weight:600;color:var(--accent);margin-bottom:2px}
.bubble-time{font-size:10px;opacity:.5;margin-top:3px;text-align:right}
.chat-msg:not(.own) .bubble-time{color:var(--text2)}
.chat-msg.own .bubble-time{color:rgba(255,255,255,.7)}
.chat-input-row{padding:10px 12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--card);transition:background .35s,border .35s}
.chat-input-row input{flex:1;border:1px solid var(--border);border-radius:24px;padding:10px 16px;font-family:inherit;font-size:14px;outline:none;background:var(--input);color:var(--text);transition:all .25s}
.chat-input-row input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.chat-input-row input::placeholder{color:var(--text2)}
.chat-send{width:40px;height:40px;border-radius:50%;border:none;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s;flex-shrink:0}
.chat-send:hover{background:var(--accent2);transform:scale(1.05)}
.chat-send:active{transform:scale(.95)}
.chat-send:disabled{opacity:.4;cursor:not-allowed;transform:none}
.chat-locked{margin:auto;text-align:center;display:flex;flex-direction:column;gap:.8rem;color:var(--text2);font-size:13px;animation:fadeIn .4s ease}
.overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:var(--overlay);opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(3px)}
.overlay.open{opacity:1;pointer-events:auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 32px var(--shadow);animation:popIn .3s ease}
.card-auth{width:min(380px,92vw);padding:1.6rem}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;padding-bottom:.7rem;border-bottom:1px solid var(--border)}
.card-title{font-size:18px;color:var(--text);font-weight:600}
.card-close{background:none;border:none;cursor:pointer;color:var(--text2);padding:4px;border-radius:8px;transition:all .2s;display:flex;align-items:center;justify-content:center}
.card-close:hover{background:var(--hover);color:var(--text)}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:1rem}
.tab{flex:1;text-align:center;padding:8px 0;background:none;border:none;border-bottom:2px solid transparent;color:var(--text2);cursor:pointer;font-size:13px;font-family:inherit;transition:all .2s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.field{margin-bottom:.8rem;display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--text2);font-weight:500}
.field input,.field textarea{border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:13px;color:var(--text);background:var(--input);outline:none;resize:none;transition:all .25s}
.field input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;font-family:inherit;font-size:13px;color:var(--text);border:1px solid var(--border);border-radius:10px;background:var(--card);cursor:pointer;transition:all .25s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent2)}
.btn-block{width:100%;padding:10px 0;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.divider{display:flex;align-items:center;gap:.6rem;margin:1rem 0;color:var(--text2);font-size:11px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
.btn-google{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 0;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-family:inherit;font-size:13px;cursor:pointer;transition:all .25s}
.btn-google:hover{box-shadow:0 2px 8px var(--shadow);border-color:var(--accent)}
.msg{font-size:12px;min-height:1.2em;margin-top:.6rem;text-align:center}
.msg.error{color:#dc2626}
.msg.success{color:#16a34a}
.profile-header{display:flex;align-items:center;gap:1rem;margin-bottom:1rem}
.profile-avatar-wrap{position:relative;cursor:pointer;flex-shrink:0}
.profile-avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:600;font-size:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-avatar-overlay{position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.profile-avatar-wrap:hover .profile-avatar-overlay{opacity:1}
.profile-avatar-overlay .material-symbols-outlined{color:#fff;font-size:20px}
#avatarFileInput{display:none}
.profile-email{font-size:12px;color:var(--text2);word-break:break-all}
.profile-since{font-size:11px;color:var(--text2);margin-top:2px}
.profile-section-title{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin:1rem 0 .5rem;padding-top:.8rem;border-top:1px solid var(--border)}
.profile-info-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:12px;border-bottom:1px solid var(--border)}
.profile-info-val{color:var(--text2);font-family:monospace;font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.market-page{height:100%;overflow-y:auto}
.market-wrap{max-width:960px;margin:0 auto;padding:24px 20px 60px}
.market-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.market-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px}
.market-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.market-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;transition:all .25s;animation:popIn .35s ease;position:relative}
.market-card:hover{border-color:var(--accent);box-shadow:0 6px 20px var(--shadow);transform:translateY(-2px)}
.market-icon{font-size:32px;line-height:1}
.market-name{font-weight:600;font-size:14px}
.market-desc{font-size:12px;color:var(--text2);flex:1}
.market-price{display:flex;align-items:center;gap:4px;font-weight:600;color:var(--text)}
.market-price .material-symbols-outlined{font-size:15px;color:#f59e0b}
.market-buy-btn{margin-top:4px;width:100%}
.market-empty{grid-column:1/-1;text-align:center;color:var(--text2);padding:40px;font-size:13px}
.market-admin-card{margin-bottom:20px;background:var(--card);border:1px dashed var(--accent);border-radius:14px;padding:16px}
.market-admin-card .field-row{display:flex;gap:8px;flex-wrap:wrap}
.market-admin-card .field-row .field{flex:1;min-width:110px}
.market-delete-item{position:absolute;top:10px;right:10px;background:none;border:none;color:#dc2626;cursor:pointer;padding:2px;border-radius:6px}
.market-delete-item:hover{background:var(--hover)}
.inventory-item{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--border)}
.inventory-icon{font-size:16px}
.inventory-qty{margin-left:auto;color:var(--text2);font-size:12px}
@keyframes nickRainbow{0%{color:#ef4444}14%{color:#f97316}28%{color:#eab308}42%{color:#22c55e}57%{color:#3b82f6}71%{color:#8b5cf6}85%{color:#ec4899}100%{color:#ef4444}}
@keyframes nickFire{0%{color:#ef4444}25%{color:#f97316}50%{color:#eab308}75%{color:#f97316}100%{color:#ef4444}}
@keyframes nickOcean{0%{color:#06b6d4}33%{color:#0ea5e9}66%{color:#0284c7}100%{color:#06b6d4}}
@keyframes nickSpace{0%{color:#8b5cf6}33%{color:#6366f1}66%{color:#3b82f6}100%{color:#8b5cf6}}
@keyframes nickLime{0%{color:#84cc16}33%{color:#22c55e}66%{color:#16a34a}100%{color:#84cc16}}
.nick-anim-rainbow{animation:nickRainbow 3s linear infinite}
.nick-anim-fire{animation:nickFire 1.5s ease-in-out infinite}
.nick-anim-ocean{animation:nickOcean 2.5s ease-in-out infinite}
.nick-anim-space{animation:nickSpace 4s ease-in-out infinite}
.nick-anim-lime{animation:nickLime 2s ease-in-out infinite}
.toast-stack{position:fixed;top:64px;right:16px;z-index:300;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 4px 20px var(--shadow);padding:12px 16px;font-size:13px;color:var(--text);width:320px;max-width:calc(100vw - 32px);display:flex;align-items:flex-start;gap:10px;opacity:0;transform:translateX(20px);transition:all .3s ease;pointer-events:auto}
.toast.show{opacity:1;transform:translateX(0)}
.toast .toast-icon{width:24px;height:24px;border-radius:50%;background:var(--accent);flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px}
.toast .toast-icon .material-symbols-outlined{font-size:14px;color:#fff}
.toast .toast-text{min-width:0;flex:1}
.toast .toast-text b{display:block;margin-bottom:2px;color:var(--text);font-size:13px;font-weight:600}
.toast .toast-text span{font-size:12px;color:var(--text2);line-height:1.4;display:block}
.hidden{display:none !important}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20;vertical-align:middle;line-height:1}

<div class="toast-stack" id="toastStack"></div>

<script>
function initApp(){
const{signInWithEmailAndPassword,createUserWithEmailAndPassword,signInWithPopup,signOut,onAuthStateChanged,updateProfile,reauthenticateWithCredential,EmailAuthProvider,updatePassword,doc,getDoc,setDoc,updateDoc,deleteDoc,serverTimestamp,collection,addDoc,query,orderBy,limit,onSnapshot,getDocs,where,runTransaction}=window.firebaseFns;

const html=document.documentElement;
const themeBtn=document.getElementById('themeToggle');
html.setAttribute('data-theme',localStorage.getItem('qn-theme')||'light');
updateThemeIcon();
themeBtn.addEventListener('click',()=>{const c=html.getAttribute('data-theme'),n=c==='dark'?'light':'dark';html.setAttribute('data-theme',n);localStorage.setItem('qn-theme',n);updateThemeIcon()});
function updateThemeIcon(){themeBtn.innerHTML=html.getAttribute('data-theme')==='dark'?'<span class="material-symbols-outlined filled">light_mode</span>':'<span class="material-symbols-outlined filled">dark_mode</span>'}

const toastStack=document.getElementById('toastStack');
function showToast(title,body,opts){opts=opts||{};const t=document.createElement('div');t.className='toast';t.innerHTML='<div class="toast-icon"><span class="material-symbols-outlined filled">info</span></div><div class="toast-text"><b></b><span></span></div>';t.querySelector('b').textContent=title;t.querySelector('span').textContent=body||'';toastStack.appendChild(t);requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add('show')));setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),400)},opts.duration||3500)}
function initials(t){return t?t.trim().slice(0,2).toUpperCase():'?'}
function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function sanitizeAvatar(u){if(!u||typeof u!=='string')return'';if(!u.startsWith('data:image/'))return'';if(u.length>300000)return'';return u}
function sanitizeNick(n){if(!n)return'';return n.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'').slice(0,30)}
function friendlyError(c){const m={'auth/invalid-email':'Некорректный email','auth/user-not-found':'Пользователь не найден','auth/wrong-password':'Неверный пароль','auth/email-already-in-use':'Email уже зарегистрирован','auth/weak-password':'Пароль слишком короткий','auth/invalid-credential':'Неверный email или пароль','auth/popup-closed-by-user':'Окно входа закрыто','auth/popup-blocked':'Окно заблокировано браузером','auth/cancelled-popup-request':'Вход отменён','auth/operation-not-allowed':'Google вход не включён в Firebase Console','auth/unauthorized-domain':'Домен не авторизован в Firebase','auth/internal-error':'Ошибка конфигурации Firebase. Включите Google Auth в Console'};return m[c]||'Ошибка ('+c+')'}
function formatTime(ts){if(!ts)return'...';if(typeof ts==='object'&&ts!==null&&typeof ts.toDate!=='function'&&!ts.seconds)return'сейчас';try{const d=ts.toDate?ts.toDate():ts.seconds?new Date(ts.seconds*1000):new Date(ts);return isNaN(d.getTime())?'...':d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}catch(e){return'сейчас'}}

let mode='login',currentUser=null,usersCache={},currentAvatarData=null;
const audioCtx=new(window.AudioContext||window.webkitAudioContext)();
function playNotifSound(){try{if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='sine';o.frequency.setValueAtTime(880,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(1320,audioCtx.currentTime+.08);g.gain.setValueAtTime(.15,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.25);o.start(audioCtx.currentTime);o.stop(audioCtx.currentTime+.25)}catch(e){}}

const authOverlay=document.getElementById('authOverlay'),authClose=document.getElementById('authClose'),authForms=document.getElementById('authForms'),authTitle=document.getElementById('authTitle'),emailInput=document.getElementById('authEmail'),passwordInput=document.getElementById('authPassword'),submitBtn=document.getElementById('authSubmit'),googleBtn=document.getElementById('authGoogle'),messageEl=document.getElementById('authMessage'),authTrigger=document.getElementById('authTrigger'),userTrigger=document.getElementById('userTrigger'),topbarAvatar=document.getElementById('topbarAvatar'),topbarUserName=document.getElementById('topbarUserName'),stageActions=document.getElementById('stageActions'),stageLogged=document.getElementById('stageLogged'),stageAvatar=document.getElementById('stageAvatar'),stageName=document.getElementById('stageName'),stageEmail=document.getElementById('stageEmail');

function openAuth(){authForms.classList.remove('hidden');authTitle.textContent=mode==='login'?'Вход':'Регистрация';emailInput.value='';passwordInput.value='';messageEl.textContent='';authOverlay.classList.add('open')}
function closeAuth(){authOverlay.classList.remove('open')}
function setMessage(t,c){messageEl.textContent=t||'';messageEl.className='msg'+(c?' '+c:'')}
function setMode(m){mode=m;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.mode===m));submitBtn.innerHTML=m==='login'?'<span class="material-symbols-outlined" style="font-size:16px">login</span>Войти':'<span class="material-symbols-outlined" style="font-size:16px">person_add</span>Создать аккаунт';authTitle.textContent=m==='login'?'Вход':'Регистрация';setMessage('')}

authTrigger.addEventListener('click',openAuth);
document.getElementById('stageLoginBtn').addEventListener('click',()=>{setMode('login');openAuth()});
document.getElementById('stageRegBtn').addEventListener('click',()=>{setMode('register');openAuth()});
authClose.addEventListener('click',closeAuth);
authOverlay.addEventListener('click',e=>{if(e.target===authOverlay)closeAuth()});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>setMode(t.dataset.mode)));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeAuth();closeProfile()}});

let authAttempts=0,authCooldownUntil=0;
submitBtn.addEventListener('click',async()=>{
  const email=emailInput.value.trim(),password=passwordInput.value;
  if(!email||!password){setMessage('Заполни email и пароль','error');return}
  if(Date.now()<authCooldownUntil){const sec=Math.ceil((authCooldownUntil-Date.now())/1000);setMessage('Подождите '+sec+' сек','error');return}
  submitBtn.disabled=true;setMessage('');
  try{
    if(mode==='login'){
      await signInWithEmailAndPassword(auth,email,password);
    }else{
      if(password.length<6){setMessage('Пароль минимум 6 символов','error');submitBtn.disabled=false;return}
      await createUserWithEmailAndPassword(auth,email,password);
    }
    authAttempts=0;closeAuth();
  }catch(e){
    console.error('Auth error:',e);
    authAttempts++;
    if(authAttempts>=5){authCooldownUntil=Date.now()+60000;authAttempts=0;setMessage('Слишком много попыток. Подождите 60 сек','error')}
    else setMessage(friendlyError(e.code),'error');
  }finally{submitBtn.disabled=false}
});
googleBtn.addEventListener('click',async()=>{
  setMessage('','');googleBtn.disabled=true;
  try{
    await signInWithPopup(auth,window.googleProvider);
    closeAuth();
  }catch(e){
    console.error('Google auth error:',e);
    setMessage(friendlyError(e.code),'error');
  }finally{googleBtn.disabled=false}
});

const profileOverlay=document.getElementById('profileOverlay'),profileClose=document.getElementById('profileClose'),profileAvatarEl=document.getElementById('profileAvatar'),profileEmailEl=document.getElementById('profileEmail'),profileSinceEl=document.getElementById('profileSince'),profileNameEl=document.getElementById('profileName'),profileBioEl=document.getElementById('profileBio'),profileSaveBtn=document.getElementById('profileSave'),profileMessageEl=document.getElementById('profileMessage'),authLogoutBtn=document.getElementById('authLogout'),avatarFileInput=document.getElementById('avatarFileInput'),avatarWrap=document.getElementById('avatarWrap'),profileDisplayNameEl=document.getElementById('profileDisplayName'),secCurrentPass=document.getElementById('secCurrentPass'),secNewPass=document.getElementById('secNewPass'),secChangePassBtn=document.getElementById('secChangePass'),secPassMsg=document.getElementById('secPassMsg'),secUidEl=document.getElementById('secUid'),secEmailEl=document.getElementById('secEmail'),secNickEl=document.getElementById('secNick'),balancePillEl=document.getElementById('balancePill'),balanceAmountEl=document.getElementById('balanceAmount'),profileBalanceEl=document.getElementById('profileBalance'),inventoryListEl=document.getElementById('inventoryList');
const viewMarketEl=document.getElementById('viewMarket'),marketGridEl=document.getElementById('marketGrid'),marketAdminCardEl=document.getElementById('marketAdminCard'),marketNewIcon=document.getElementById('marketNewIcon'),marketNewName=document.getElementById('marketNewName'),marketNewPrice=document.getElementById('marketNewPrice'),marketNewDesc=document.getElementById('marketNewDesc'),marketAddBtn=document.getElementById('marketAddBtn');

let unsubscribeOwnUser=null;
function subscribeOwnUser(uid){if(unsubscribeOwnUser)unsubscribeOwnUser();unsubscribeOwnUser=onSnapshot(doc(db,'users',uid),snap=>{if(!snap.exists())return;const d=snap.data();updateBalanceUI(d.balance);if(usersCache[uid])usersCache[uid].admin=!!d.admin;if(d.banned&&currentUser)signOut(auth)},()=>{})}

async function renderInventory(uid){inventoryListEl.innerHTML='';try{const s=await getDocs(collection(db,'users',uid,'inventory'));if(s.empty){inventoryListEl.innerHTML='<div style="color:var(--text2);font-size:12px;padding:6px 0">Пусто</div>';return}s.forEach(d=>{const it=d.data();const row=document.createElement('div');row.className='inventory-item';row.innerHTML='<span class="inventory-icon">'+esc(it.icon||'🎁')+'</span><span>'+esc(it.name||'Товар')+'</span><span class="inventory-qty">x'+(it.quantity||1)+'</span>';inventoryListEl.appendChild(row)})}catch(e){inventoryListEl.innerHTML=''}}

async function renderChatList(q){if(!currentUser){chatListEl.innerHTML='<div class="chat-empty">Войдите, чтобы видеть чаты</div>';return}if(q){chatListEl.innerHTML='';renderGlobalChatItem();const s=q.toLowerCase(),results=[];for(const [uid,d] of Object.entries(usersCache)){if(uid===currentUser.uid)continue;if(d.name.toLowerCase().includes(s)||d.nick.toLowerCase().includes(s))results.push({uid,...d})}if(!results.length){chatListEl.innerHTML+='<div class="chat-empty" style="padding:20px">Никого не нашли</div>';return}results.forEach((p,i)=>{const item=document.createElement('div');item.className='chat-item-wrap';item.style.animationDelay=((i+1)*.05)+'s';const av=sanitizeAvatar(p.avatar);item.innerHTML='<div class="chat-item-avatar">'+(av?'<img src="'+esc(av)+'">':initials(p.name))+'</div><div class="chat-item-info"><div class="chat-item-name">'+esc(p.name)+'</div><div class="chat-item-last">@'+esc(p.nick)+'</div></div>';item.addEventListener('click',()=>startChatWith(p.uid));chatListEl.appendChild(item)});return}loadActiveChats()}

let chatsLoadGeneration=0,loadActiveChatsRunning=false;
async function loadActiveChats(){if(loadActiveChatsRunning){chatsLoadGeneration++;return}loadActiveChatsRunning=true;const gen=++chatsLoadGeneration;try{const s=await getDocs(collection(db,'chats'));if(gen!==chatsLoadGeneration)return;chatListEl.innerHTML='';renderGlobalChatItem();const myChats=[];s.forEach(d=>{const data=d.data();if(d.id===GLOBAL_CHAT_ID||data.type==='global')return;if(data.participants&&data.participants.includes(currentUser.uid))myChats.push({id:d.id,...data})});myChats.sort((a,b)=>(b.lastMessageAt?.seconds||0)-(a.lastMessageAt?.seconds||0));for(const chat of myChats){const otherUid=chat.participants.find(p=>p!==currentUser.uid);let other=usersCache[otherUid];if(!other){try{const us=await getDoc(doc(db,'users',otherUid));if(us.exists()){const ud=us.data();const ep=ud.email?.split('@')[0]||'';other={name:(ud.displayName||ep||'Пользователь').slice(0,40),avatar:sanitizeAvatar(ud.avatar)||'',nick:(ud.nick||ep).slice(0,30),email:ud.email||'',admin:!!ud.admin,banned:!!ud.banned};usersCache[otherUid]=other}}catch(e){}}if(!other)other={name:'Пользователь',avatar:'',nick:''};const item=document.createElement('div');item.className='chat-item-wrap'+(activeChatId===chat.id?' active':'');let unreadCount=0;const lastReadTs=chat.lastRead&&chat.lastRead[currentUser.uid];if(lastReadTs){try{const uq=query(collection(db,'chats',chat.id,'messages'),where('createdAt','>',lastReadTs));const us=await getDocs(uq);us.forEach(md=>{if(md.data().uid!==currentUser.uid)unreadCount++})}catch(e){}}else if(chat.lastMessageAt){try{const uq=query(collection(db,'chats',chat.id,'messages'),where('createdAt','>',chat.lastMessageAt));const us=await getDocs(uq);us.forEach(md=>{if(md.data().uid!==currentUser.uid)unreadCount++})}catch(e){}}const badgeHTML=unreadCount>0?'<div class="chat-unread-badge">'+unreadCount+'</div>':'';const adminBadge=other.admin?'<span class="admin-badge"><span class="material-symbols-outlined">shield</span>ADMIN</span>':'';const av=sanitizeAvatar(other.avatar);item.innerHTML='<div class="chat-item-avatar">'+(av?'<img src="'+esc(av)+'">':initials(other.name))+'</div><div class="chat-item-info"><div class="chat-item-name">'+esc(other.name)+adminBadge+'</div><div class="chat-item-last">@'+esc(other.nick)+(chat.lastMessage?' &middot; '+esc(chat.lastMessage):'')+'</div></div>'+badgeHTML;item.addEventListener('click',()=>openChatWith(otherUid));chatListEl.appendChild(item)}}catch(e){}finally{loadActiveChatsRunning=false}}

async function ensureGlobalChat(){try{const ref=doc(db,'chats',GLOBAL_CHAT_ID);const snap=await getDoc(ref);if(!snap.exists())await setDoc(ref,{type:'global',name:'Общий чат',lastMessageAt:serverTimestamp()})}catch(e){}}

const DAILY_REWARD=50;
const dailyBtn=document.getElementById('dailyBtn');
dailyBtn.addEventListener('click',async()=>{
  if(!currentUser)return;
  dailyBtn.disabled=true;
  try{
    const ref=doc(db,'users',currentUser.uid),snap=await getDoc(ref);
    if(!snap.exists()){showToast('Ошибка','');return}
    const data=snap.data(),now=Date.now();
    if(data.lastDaily){
      const last=data.lastDaily.seconds?data.lastDaily.seconds*1000:new Date(data.lastDaily).getTime();
      const diff=now-last;
      if(diff<86400000){
        const h=Math.ceil((86400000-diff)/3600000);
        dailyBtn.textContent='Доступно через '+h+' ч.';
        setTimeout(()=>{dailyBtn.innerHTML='<span class="material-symbols-outlined" style="font-size:18px">redeem</span>Ежедневная награда'},3000);
        return;
      }
    }
    const bal=(data.balance||0)+DAILY_REWARD;
    await updateDoc(ref,{balance:bal,lastDaily:serverTimestamp()});
    showToast('Награда','+'+DAILY_REWARD+' кредитов');
  }catch(e){console.error(e);showToast('Ошибка','Не удалось получить награду')}
  finally{dailyBtn.disabled=false}
});

async function seedMarket(){
  if(!isAdmin())return;
  try{
    const s=await getDocs(collection(db,'market'));
    const existing=new Set();s.forEach(d=>existing.add(d.data().name));
    let added=0;
    for(const it of MARKET_ITEMS){
      if(!existing.has(it.name)){
        await addDoc(collection(db,'market'),{...it,active:true,createdAt:serverTimestamp()});
        added++;
      }
    }
    if(added>0){showToast('Маркет','Добавлено '+added+' товаров');loadMarketItems()}
    else showToast('Маркет','Все товары уже есть');
  }catch(e){console.error(e);showToast('Ошибка','Нет прав. Обнови правила Firestore')}
}

document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='m'&&isAdmin()){e.preventDefault();seedMarket()}});

function applyEffects(){
  if(!currentUser)return;
  const uid=currentUser.uid;
  getDocs(collection(db,'users',uid,'inventory')).then(s=>{
    const nickColors=[],nickGlows=[],nickFonts=[],nickAnims=[],avatarEffects=[];
    s.forEach(d=>{const it=d.data();if(it.quantity>0){
      if(it.type==='nickColor')nickColors.push(it);
      else if(it.type==='nickGlow')nickGlows.push(it);
      else if(it.type==='nickFont')nickFonts.push(it);
      else if(it.type==='nickAnimated')nickAnims.push(it);
      else if(it.type==='avatarEffect')avatarEffects.push(it);
    }});
    window._myNickColor=nickColors.length?nickColors[nickColors.length-1].value:null;
    window._myNickGlow=nickGlows.length?nickGlows[nickGlows.length-1].value:null;
    window._myNickFont=nickFonts.length?nickFonts[nickFonts.length-1].value:null;
    window._myNickAnim=nickAnims.length?nickAnims[nickAnims.length-1].value:null;
    window._myAvatarEffect=avatarEffects.length?avatarEffects[avatarEffects.length-1].value:null;
    applyNickEffects();
    if(window._myAvatarEffect){
      const effect=window._myAvatarEffect;
      let style='';
      if(effect==='rainbow')style='0 0 8px #ec4899,0 0 12px #a855f7,0 0 16px #3b82f6';
      else if(effect==='stars')style='0 0 6px #eab308,0 0 12px #f59e0b';
      else if(effect==='waves')style='0 0 8px #06b6d4,0 0 14px #0891b2';
      else if(effect==='smoke')style='0 0 12px rgba(100,100,100,.5)';
      else if(effect==='neon')style='0 0 6px #22d3ee,0 0 14px #06b6d4,0 0 22px #0891b2';
      else if(effect==='sakura')style='0 0 8px #f472b6,0 0 14px #ec4899';
      else if(effect==='space')style='0 0 8px #6366f1,0 0 14px #8b5cf6,0 0 20px #a78bfa';
      else if(effect==='glitch')style='0 0 6px #ef4444,2px 0 0 #3b82f6,-2px 0 0 #22c55e';
      document.querySelectorAll('#stageAvatar,#topbarAvatar,#chatMainAvatar,#profileAvatar').forEach(el=>{
        el.style.boxShadow=style;
      });
    }
  }).catch(()=>{});
}

function applyNickEffects(){
  document.querySelectorAll('.bubble-nick').forEach(el=>{
    const msgUid=el.closest('.chat-msg')?.dataset?.uid;
    if(msgUid!==currentUser?.uid)return;
    el.style.cssText='';
    el.className='bubble-nick';
    if(window._myNickGlow){
      el.style.color=window._myNickGlow;
      el.style.textShadow='0 0 6px '+window._myNickGlow+',0 0 12px '+window._myNickGlow+',0 0 20px '+window._myNickGlow;
    }else if(window._myNickColor){
      el.style.color=window._myNickColor;
    }
    if(window._myNickFont){
      el.style.fontFamily=window._myNickFont;
    }
    if(window._myNickAnim){
      el.classList.add('nick-anim-'+window._myNickAnim);
    }
  });
}

function getNickClasses(){
  let cls='';
  if(window._myNickAnim)cls+=' nick-anim-'+window._myNickAnim;
  return cls;
}
function getNickInlineStyle(){
  let s='';
  if(window._myNickGlow)s+='color:'+window._myNickGlow+';text-shadow:0 0 6px '+window._myNickGlow+',0 0 12px '+window._myNickGlow+',0 0 20px '+window._myNickGlow+';';
  else if(window._myNickColor)s+='color:'+window._myNickColor+';';
  if(window._myNickFont)s+='font-family:'+window._myNickFont+';';
  return s?' style="'+s+'"':'';
}
